// Web Audio SFX Generator (ไม่ต้องพึ่งไฟล์ภายนอก เล่นเสียงได้แน่นอน)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSFX(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'start') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'heartbeat') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }
}

// Snow Particle System
const canvas = document.getElementById('snow-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const flakes = Array.from({ length: 60 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 3 + 1,
    d: Math.random() * 0.8 + 0.4
}));

function drawSnow() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
    ctx.beginPath();
    for (let f of flakes) {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
    }
    ctx.fill();
    moveSnow();
}

function moveSnow() {
    for (let f of flakes) {
        f.y += Math.pow(f.d, 2) + 0.4;
        f.x += Math.sin(f.y / 35);
        if (f.y > height) {
            f.y = -10;
            f.x = Math.random() * width;
        }
    }
}

let historyStack = [];

function startGame() {
    playSFX('start');
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    historyStack = [];
    renderScene("start", false);
}

function renderScene(sceneKey, isGoingBack = false) {
    const scene = STORY_DATA[sceneKey];
    if (!scene) return;

    if (!isGoingBack && (historyStack.length === 0 || historyStack[historyStack.length - 1] !== sceneKey)) {
        historyStack.push(sceneKey);
    }

    document.getElementById("back-btn").style.display = historyStack.length > 1 ? "inline-block" : "none";

    const totalEvidence = Math.min(100, scene.evidence || 0);
    document.getElementById("evidence-text").innerText = `ระดับความจริง: ${totalEvidence}%`;
    document.getElementById("story-display").innerText = scene.text;

    const choicesContainer = document.getElementById("choices-display");
    choicesContainer.innerHTML = "";

    if (scene.choices && scene.choices.length > 0) {
        scene.choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "btn-choice";
            btn.innerText = choice.text;
            btn.onclick = () => {
                playSFX('click');
                renderScene(choice.next, false);
            };
            choicesContainer.appendChild(btn);
        });
    } else {
        playSFX('heartbeat');
        const restartBtn = document.createElement("button");
        restartBtn.className = "btn-main";
        restartBtn.style.marginTop = "20px";
        restartBtn.innerText = "🔄 เริ่มต้นย้อนเวลาสืบสวนใหม่";
        restartBtn.onclick = () => {
            playSFX('start');
            historyStack = [];
            renderScene("start", false);
        };
        choicesContainer.appendChild(restartBtn);
    }
}

function goBack() {
    if (historyStack.length > 1) {
        playSFX('click');
        historyStack.pop();
        const previousScene = historyStack[historyStack.length - 1];
        renderScene(previousScene, true);
    }
}
