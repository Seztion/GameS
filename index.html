<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมสืบสวนคดีปริศนา (LIVE)</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .game-container {
            background-color: rgba(30, 30, 30, 0.95);
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }
        .header {
            color: #ffcc00;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .stats {
            color: #00ffcc;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .story-text {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 25px;
            white-space: pre-line;
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-choice {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #ffcc00;
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .btn-choice:hover {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
        }
        .restart-btn {
            margin-top: 20px;
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">🔍 รายการสืบสวนคดีปริศนา (LIVE)</div>
    <div class="stats" id="evidence-text">📊 ระดับความคลี่คลายคดี: 0%</div>
    <div class="story-text" id="story-display">กำลังโหลดเนื้อเรื่อง...</div>
    <div class="choices-container" id="choices-display"></div>
</div>

<script>
const STORY_DATA = {
    "start": {
        "text": "[คดี: คฤหาสน์เสียงสะอื้น]\nคืนฝนตก... มหาเศรษฐีถูกพบเป็นศพในห้องทำงานที่ล็อคจากข้างใน\nเบาะแสแรกที่คุณเลือกตรวจในที่เกิดเหตุคืออะไร?",
        "evidence_gain": 0,
        "choices": [
            {"text": "1. แก้วกาแฟที่ยังมีควันฉุยบนโต๊ะ", "next": "scene_coffee"},
            {"text": "2. รอยโคลนตรงหน้าต่างที่เปิดแย้มไว้", "next": "scene_window"},
            {"text": "3. รอยแผลประหลาดที่หลังคอผู้เสียชีวิต", "next": "scene_wound"}
        ]
    },
    "scene_coffee": {
        "text": "[เบาะแส: แก้วกาแฟ]\nพบกลิ่นอัลมอนด์จางๆ (พิษไซยาไนด์!)\nทันใดนั้น แม่บ้านเดินเข้ามาในห้องด้วยท่าทีลุกลี้ลุกลน...",
        "evidence_gain": 20,
        "choices": [
            {"text": "1. กดดันเค้นสอบแม่บ้านทันที", "next": "scene_interrogate_maid"},
            {"text": "2. แกล้งทำเป็นไม่สงสัย แล้วขอไปตรวจห้องครัว", "next": "scene_kitchen"}
        ]
    },
    "scene_window": {
        "text": "[เบาะแส: รอยโคลน]\nรอยเท้าประทับเป็นขนาดเล็กเกินกว่าจะเป็นของผู้ชาย\nและมีเศษผ้าราคาแพงเกี่ยวติดอยู่กับกรอบหน้าต่าง...",
        "evidence_gain": 15,
        "choices": [
            {"text": "1. ตามรอยเท้าออกไปค้นในสวนหลังบ้าน", "next": "scene_garden"},
            {"text": "2. นำเศษผ้าไปสอบถามคุณนายผู้เป็นภรรยา", "next": "scene_wife"}
        ]
    },
    "scene_wound": {
        "text": "[เบาะแส: รอยแผล]\nรอยแผลเหมือนถูกเข็มฉีดยาขนาดเล็กแทงอย่างแม่นยำ\nสันนิษฐานได้ว่าผู้ลงมือต้องมีความรู้ทางการแพทย์!",
        "evidence_gain": 25,
        "choices": [
            {"text": "1. เรียกตัว 'หมอประจำตัว' เข้ามาสอบสวน", "next": "scene_doctor"},
            {"text": "2. ค้นหีบยาและเอกสารในตู้หนังสือ", "next": "scene_safe"}
        ]
    },
    "scene_interrogate_maid": {
        "text": "[สถานการณ์: เค้นสอบแม่บ้าน]\nแม่บ้านตกใจกลัวจนร้องไห้โฮ และหลุดปากว่า 'คุณนายสั่งให้ฉันชงกาแฟแก้วนี้!'",
        "evidence_gain": 25,
        "choices": [
            {"text": "1. ไปจับกุมคุณนายทันที", "next": "end_arrest_wife_early"},
            {"text": "2. ตรวจสอบบัญชีธนาคารของแม่บ้านก่อน", "next": "scene_bank"}
        ]
    },
    "scene_kitchen": {
        "text": "[สถานการณ์: ห้องครัว]\nคุณพบขวดยาพิษซ่อนอยู่ในถังขยะ และมีลายนิ้วมือสืบไปถึงคุณนาย!",
        "evidence_gain": 45,
        "choices": [
            {"text": "1. รวบรวมหลักฐานเปิดโปงคุณนายต่อหน้าทุกคน", "next": "end_true"}
        ]
    },
    "scene_garden": {
        "text": "[สถานการณ์: สวนหลังบ้าน]\nฝนตกหนักกลบรอยเท้า แต่คุณพบถุงมือเปื้อนเลือดถูกทิ้งไว้ในพุ่มไม้",
        "evidence_gain": 30,
        "choices": [
            {"text": "1. นำถุงมือไปให้หมอประจำตัวพิสูจน์", "next": "scene_doctor"}
        ]
    },
    "scene_wife": {
        "text": "[สถานการณ์: ห้องรับแขก]\nคุณนายปฏิเสธรอยผ้า แต่แสดงอาการลนลานเมื่อเห็นคุณพูดถึงเรื่องมรดก",
        "evidence_gain": 20,
        "choices": [
            {"text": "1. สั่งเปิดตู้เซฟของผู้เสียชีวิต", "next": "scene_safe"}
        ]
    },
    "scene_doctor": {
        "text": "[สถานการณ์: สอบหมอประจำตัว]\nหมอปฏิเสธทุกข้อกล่าวหา แต่แอบซ่อนสลิงฉีดยาไว้ในกระเป๋าเสื้อ",
        "evidence_gain": 30,
        "choices": [
            {"text": "1. จับกุมหมอประจำตัวทันที", "next": "end_arrest_doctor"},
            {"text": "2. ค้นกระเป๋าหมอเพื่อดูตัวยา", "next": "end_true"}
        ]
    },
    "scene_safe": {
        "text": "[สถานการณ์: ตู้เซฟ]\nคุณพบพินัยกรรมฉบับใหม่ที่ระบุยกมรดกทั้งหมดให้ 'มูลนิธิ' ไม่ใช่คนในครอบครัว!",
        "evidence_gain": 30,
        "choices": [
            {"text": "1. เรียกทุกคนมารวมตัวเพื่อชี้ตัวคนร้ายตัวจริง", "next": "end_true"}
        ]
    },
    "scene_bank": {
        "text": "[สถานการณ์: บัญชีธนาคาร]\nพบเงินโอนลึกลับเข้าบัญชีแม่บ้านจาก 'หมอประจำตัว'!",
        "evidence_gain": 40,
        "choices": [
            {"text": "1. จับกุมหมอและแม่บ้านที่เป็นผู้ร่วมขบวนการ", "next": "end_mastermind"}
        ]
    },
    "end_true": {
        "text": "🏆 [TRUE ENDING: ไขคดีสมบูรณ์แบบ]\nคุณชี้ตัวคนร้ายพร้อมหลักฐานมัดตัวแน่นหนา! คนดูในแชทปรบมือแซ่ซ้อง คุณคือยอดนักสืบระดับโลก!",
        "evidence_gain": 0,
        "choices": []
    },
    "end_mastermind": {
        "text": "🌟 [SPECIAL ENDING: แฉบงการซ้อนแผน]\nคุณพบว่าหมอและแม่บ้านร่วมมือกันเพื่อฆ่าเอาเงินประกัน! จับกุมยกแก๊งสำเร็จ!",
        "evidence_gain": 0,
        "choices": []
    },
    "end_arrest_wife_early": {
        "text": "❌ [BAD ENDING: จับผิดคน]\nคุณรีบร้อนจับคุณนาย แต่หลักฐานไม่พอ คุณนายถูกปล่อยตัวและทนายฟ้องคุณกลับ! (GAME OVER)",
        "evidence_gain": 0,
        "choices": []
    },
    "end_arrest_doctor": {
        "text": "⚠️ [NORMAL ENDING: จับได้แค่ตัวเบ้ง]\nหมอถูกจับ แต่นักสืบรู้สึกว่ายังมีผู้บงการคนอื่นที่ยังลอยนวลอยู่...",
        "evidence_gain": 0,
        "choices": []
    }
};

let currentScene = "start";
let totalEvidence = 0;

function renderScene(sceneKey) {
    const scene = STORY_DATA[sceneKey];
    if (!scene) return;

    totalEvidence = Math.min(100, totalEvidence + scene.evidence_gain);
    document.getElementById("evidence-text").innerText = `📊 ระดับความคลี่คลายคดี: ${totalEvidence}%`;
    document.getElementById("story-display").innerText = scene.text;

    const choicesContainer = document.getElementById("choices-display");
    choicesContainer.innerHTML = "";

    if (scene.choices.length > 0) {
        scene.choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "btn-choice";
            btn.innerText = choice.text;
            btn.onclick = () => renderScene(choice.next);
            choicesContainer.appendChild(btn);
        });
    } else {
        const restartBtn = document.createElement("button");
        restartBtn.className = "restart-btn";
        restartBtn.innerText = "🔄 เริ่มเกมใหม่";
        restartBtn.onclick = () => {
            totalEvidence = 0;
            renderScene("start");
        };
        choicesContainer.appendChild(restartBtn);
    }
}

renderScene("start");
</script>

</body>
</html>
