<script>

/* =========================================================
   AUDIO ENGINE
   ไม่มีไฟล์เสียงภายนอก
========================================================= */

let audioContext = null;

let masterVolume = .55;

let soundEnabled = true;

let typeEnabled = true;


/* ---------------------------------------------------------
   START AUDIO
--------------------------------------------------------- */

function initAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }

}


/* ---------------------------------------------------------
   BASIC TONE
--------------------------------------------------------- */

function tone(
    frequency,
    duration,
    type="sine",
    volume=.08,
    delay=0
){

    if(!soundEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    const start =
        audioContext.currentTime + delay;

    const end =
        start + duration;

    gain.gain.setValueAtTime(
        0,
        start
    );

    gain.gain.linearRampToValueAtTime(
        volume * masterVolume,
        start + .01
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        end
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start(start);

    oscillator.stop(end + .02);

}


/* ---------------------------------------------------------
   CLICK
--------------------------------------------------------- */

function soundClick(){

    tone(
        620,
        .055,
        "sine",
        .12
    );

    tone(
        920,
        .035,
        "sine",
        .05,
        .015
    );

}


/* ---------------------------------------------------------
   READ
--------------------------------------------------------- */

function soundRead(){

    tone(
        390,
        .08,
        "sine",
        .055
    );

    tone(
        590,
        .12,
        "sine",
        .045,
        .05
    );

}


/* ---------------------------------------------------------
   CHOICE
--------------------------------------------------------- */

function soundChoice(){

    tone(
        500,
        .08,
        "triangle",
        .09
    );

    tone(
        760,
        .12,
        "triangle",
        .07,
        .06

    if(!soundEnabled || !typeEnabled)
        return;

    const now =
        performance.now();

    if(now - lastTypeSound < 45)
        return;

    lastTypeSound = now;

    tone(
        700 + Math.random()*150,
        .018,
        "square",
        .025
    );

}

/* =========================================================
   GAME STATE
========================================================= */

let currentNode = "intro";

let currentChoices = null;

let storyQueue = [];

let queueIndex = 0;

let typingTimer = null;


/* =========================================================
   SAVE
========================================================= */

function saveEnding(id){

    let endings =
        JSON.parse(
            localStorage.getItem(
                "winterMemoryEndings"
            ) || "[]"
        );

    if(!endings.includes(id)){
        endings.push(id);
    }

    localStorage.setItem(
        "winterMemoryEndings",
        JSON.stringify(endings)
    );
}


function getEndings(){

    return JSON.parse(
        localStorage.getItem(
            "winterMemoryEndings"
        ) || "[]"
    );

}


/* =========================================================
   PARAGRAPH SPLIT
========================================================= */

function splitStory(html){

    const temp =
        document.createElement("div");

    temp.innerHTML = html;

    return [
        ...temp.children
    ];

}


/* =========================================================
   LOAD NODE
========================================================= */

function loadNode(id){

    clearInterval(typingTimer);

    initAudio();

    const node =
        STORY[id];

    if(!node){
        console.error(
            "ไม่พบ Node:",
            id
        );
        return;
    }

    currentNode = id;

    currentChoices =
        node.choices || [];

    storyQueue =
        splitStory(node.text);

    queueIndex = 0;

    document.getElementById(
        "storyContent"
    ).innerHTML = "";

    document.getElementById(
        "choices"
    ).style.display = "none";

    document.getElementById(
        "choices"
    ).innerHTML = "";

    document.getElementById(
        "continueWrap"
    ).style.display = "flex";

    document.getElementById(
        "continueButton"
    ).textContent =
        "ดำเนินเรื่องต่อ";

    document.getElementById(
        "chapterLabel"
    ).textContent =
        node.chapter || "";

    changeScene(
        node.scene || "snow"
    );

    updateProgress();

    soundScene();

    showNextPart();

}


/* =========================================================
   SHOW NEXT PART
========================================================= */

function showNextPart(){

    if(queueIndex >= storyQueue.length){

        finishNode();

        return;

    }

    const element =
        storyQueue[queueIndex];

    queueIndex++;

    const container =
        document.getElementById(
            "storyContent"
        );

    const wrapper =
        document.createElement("div");

    wrapper.innerHTML =
        element.outerHTML;

    const newElement =
        wrapper.firstElementChild;

    container.appendChild(
        newElement
    );

    container.scrollTo({
        top:container.scrollHeight,
        behavior:"smooth"
    });

    soundRead();

    if(typeEnabled){

        typeTick();

    }

}


/* =========================================================
   CONTINUE
========================================================= */

function continueStory(){

    initAudio();

    soundClick();

    if(queueIndex < storyQueue.length){

        showNextPart();

        return;

    }

    finishNode();

}


/* =========================================================
   FINISH NODE
========================================================= */

function finishNode(){

    const node =
        STORY[currentNode];

    clearInterval(typingTimer);

    if(node.ending){

        showEnding(
            currentNode,
            node
        );

        return;

    }

    document.getElementById(
        "continueWrap"
    ).style.display = "none";

    showChoices(
        node.choices || []
    );

}


/* =========================================================
   SHOW CHOICES
========================================================= */

function showChoices(choices){

    const box =
        document.getElementById(
            "choices"
        );

    box.innerHTML = "";

    if(!choices.length){

        return;

    }

    choices.forEach(choice => {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "choice-button";

        button.innerHTML =
            choice.text;

        button.onclick = () => {

            initAudio();

            soundChoice();

            fadeScene(() => {

                loadNode(
                    choice.next
                );

            });

        };

        box.appendChild(button);

    });

    box.style.display = "grid";

}


/* =========================================================
   SCENE
========================================================= */

function changeScene(scene){

    const background =
        document.getElementById(
            "background"
        );

    background.className = "";

    background.classList.add(
        "scene-" + scene
    );

}


/* =========================================================
   FADE
========================================================= */

function fadeScene(callback){

    const fade =
        document.createElement(
            "div"
        );

    fade.style.position = "fixed";
    fade.style.inset = "0";
    fade.style.zIndex = "200";
    fade.style.background = "#000";
    fade.style.opacity = "0";
    fade.style.transition =
        "opacity .4s ease";

    document.body.appendChild(
        fade
    );

    requestAnimationFrame(() => {

        fade.style.opacity = "1";

    });

    setTimeout(() => {

        callback();

        setTimeout(() => {

            fade.style.opacity = "0";

            setTimeout(() => {

                fade.remove();

            },400);

        },100);

    },400);

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

    const chapters = [
        "intro",
        "letter",
        "journey",
        "station",
        "lakeHouse",
        "meeting"
    ];

    const index =
        chapters.indexOf(
            currentNode
        );

    const percent =
        index < 0
            ? 60
            : Math.max(
                8,
                ((index + 1) /
                chapters.length) * 100
            );

    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";

}

/* =========================================================

========================================================= */

function restartGame(){

    document
        .querySelectorAll(
            ".ending-overlay,.gallery-overlay"
        )
        .forEach(el => el.remove());

    fadeScene(() => {

        loadNode("intro");

    });

}

                }
            >

                <div class="gallery-icon">
                    ${found ? end.icon : "?"}
                </div>

                <div class="gallery-title">
                    ${found ? end.title : "????"}
                </div>

                <div class="gallery-subtitle">
                    ${found
                        ? end.subtitle
                        : "ยังไม่ค้นพบ"
                    }
                </div>

                <div class="gallery-status">
                    ${found
                        ? "✓ DISCOVERED"
                        : "🔒 LOCKED"
                    }
                </div>

            </div>

        `;

    });

    overlay.innerHTML = `

        <div class="gallery-box">

            <div class="gallery-top">

                <div>

                    <div
                        style="
                            color:#9eddf8;
                            letter-spacing:4px;
                            font-size:11px;
                        "
                    >
                        WINTER MEMORY
                    </div>

                    <h2>
                        Ending Gallery
                    </h2>

                </div>

                <button
                    class="gallery-close"
                    onclick="this.closest('.gallery-overlay').remove()"
                >
                    ×
                </button>

            </div>

            <div class="gallery-grid">
                ${cards}
            </div>

        </div>

    `;

    document.body.appendChild(
        overlay
    );

}


function openUnlockedEnding(id){

    const node =
        STORY[id];

    if(!node) return;

    soundChoice();

    const overlay =
        document.querySelector(
            ".gallery-overlay"
        );

    if(overlay)
        overlay.remove();

    showEnding(
        id,
        node
    );

}

function createSnow(){

    const container =
        document.getElementById(
            "snow"
        );

    for(
        let i=0;
        i<90;
        i++
    ){

        const snow =
            document.createElement(
                "span"
            );

        snow.className =
            "snowflake";

        const size =
            Math.random()*5+2;

        snow.style.width =
            size+"px";

        snow.style.height =
            size+"px";

        snow.style.left =
            Math.random()*100+"%";

        snow.style.animationDuration =
            7 + Math.random()*12+"s";

        snow.style.animationDelay =
            -Math.random()*15+"s";

        snow.style.setProperty(
            "--drift",
            (Math.random()*180-90)+"px"
        );

        snow.style.opacity =
            .25 + Math.random()*.65;

        container.appendChild(
            snow
        );

    }

}


/* =========================================================
   LIGHTS
========================================================= */

function createLights(){

    const container =
        document.getElementById(
            "lights"
        );

    for(
        let i=0;
        i<35;
        i++
    ){

            );

        light.className =

        light.style.top =

        light.style.animationDelay =

        container.appendChild(

        );

    }

}
