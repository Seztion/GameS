<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WINTER MEMORY</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500;600&family=Noto+Serif+Thai:wght@300;400;500&display=swap');

:root{
    --bg:#02060b;
    --bg2:#08121c;
    --panel:rgba(7,16,26,.92);
    --text:#edf8ff;
    --muted:#91a5b2;
    --ice:#c8edff;
    --ice2:#82c9ec;
    --line:rgba(190,225,245,.15);
    --shadow:0 30px 100px rgba(0,0,0,.65);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(75,125,155,.15),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #010409,
            #07121d 50%,
            #02060b
        );
    font-family:'Kanit',sans-serif;
    overflow-x:hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
}

.moon{
    position:absolute;
    width:260px;
    height:260px;
    right:10%;
    top:10%;
    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #dff5ff 25%,
            #a8d2e7 60%,
            #6d9db5 100%
        );

    opacity:.48;

    box-shadow:
        0 0 60px rgba(190,230,255,.15),
        0 0 180px rgba(120,200,240,.08);
}

.moon::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;

    background:
        radial-gradient(
            circle at 60% 30%,
            rgba(50,90,110,.12) 0 8%,
            transparent 9%
        ),
        radial-gradient(
            circle at 35% 65%,
            rgba(50,90,110,.12) 0 10%,
            transparent 11%
        );
}

.fog{
    position:absolute;
    width:900px;
    height:300px;
    left:-250px;
    bottom:5%;

    background:
        radial-gradient(
            ellipse,
            rgba(170,220,240,.08),
            transparent 70%
        );

    filter:blur(25px);

    animation:fogMove 18s ease-in-out infinite alternate;
}

@keyframes fogMove{
    from{
        transform:translateX(-30px);
    }

    to{
        transform:translateX(260px);
    }
}

/* =========================================================
   SNOW
========================================================= */

.snow{
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
    overflow:hidden;
}

.snowflake{
    position:absolute;
    top:-30px;
    color:#fff;
    text-shadow:
        0 0 8px rgba(210,240,255,.8);

    animation:snowFall linear infinite;
}

@keyframes snowFall{

    0%{
        transform:
            translate3d(0,-30px,0)
            rotate(0deg);
    }

    25%{
        transform:
            translate3d(25px,25vh,0)
            rotate(90deg);
    }

    50%{
        transform:
            translate3d(-25px,50vh,0)
            rotate(180deg);
    }

    75%{
        transform:
            translate3d(30px,75vh,0)
            rotate(270deg);
    }

    100%{
        transform:
            translate3d(-15px,110vh,0)
            rotate(360deg);
    }
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:70px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 35px;

    z-index:40;

    background:
        linear-gradient(
            to bottom,
            rgba(2,6,11,.94),
            rgba(2,6,11,.5),
            transparent
        );
}

.logo{
    font-size:13px;
    letter-spacing:7px;
    color:#edfaff;
}

.logo span{
    color:#83c9ea;
}

.controls{
    display:flex;
    gap:9px;
}

.control-btn{
    width:40px;
    height:40px;

    border-radius:50%;
    border:1px solid rgba(190,230,250,.16);

    background:rgba(10,23,34,.7);

    color:#e4f7ff;

    cursor:pointer;

    transition:.25s;
}

.control-btn:hover{
    transform:translateY(-2px);
    background:rgba(30,55,70,.8);
    border-color:rgba(200,235,255,.45);
}

/* =========================================================
   GAME
========================================================= */

.game{
    position:relative;
    z-index:5;

    width:min(1080px,calc(100% - 30px));

    min-height:100vh;

    margin:auto;

    padding:
        115px
        0
        80px;
}

/* =========================================================
   CHAPTER
========================================================= */

.chapter{
    text-align:center;
    margin-bottom:28px;

    animation:chapterIn .9s ease;
}

.chapter-number{
    color:#7eb8d3;
    font-size:11px;
    letter-spacing:6px;
    margin-bottom:8px;
}

.chapter-title{
    font-family:'Itim',cursive;
    font-size:46px;
    letter-spacing:2px;

    color:#f2fbff;

    text-shadow:
        0 0 25px rgba(140,210,240,.16);
}

/* =========================================================
   NOVEL FRAME
========================================================= */

.story-box{

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(10,22,34,.96),
            rgba(4,11,18,.97)
        );

    border:
        1px solid rgba(190,225,245,.14);

    border-radius:26px;

    box-shadow:var(--shadow);

    overflow:hidden;
}

.story-box::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(180,230,255,.025),
            transparent
        );
}

/* decorative corners */

.corner{
    position:absolute;
    width:30px;
    height:30px;
    border-color:rgba(180,225,245,.25);
    border-style:solid;
    pointer-events:none;
}

.corner.tl{
    top:18px;
    left:18px;
    border-width:1px 0 0 1px;
}

.corner.tr{
    top:18px;
    right:18px;
    border-width:1px 1px 0 0;
}

.corner.bl{
    bottom:18px;
    left:18px;
    border-width:0 0 1px 1px;
}

.corner.br{
    bottom:18px;
    right:18px;
    border-width:0 1px 1px 0;
}

/* =========================================================
   NOVEL CONTENT
========================================================= */

.story-content{

    padding:
        65px
        90px
        50px;

    max-width:1000px;

    margin:auto;
}

.story-text{

    font-family:'Noto Serif Thai',serif;

    font-size:19px;

    font-weight:300;

    line-height:2.15;

    color:#dce8ed;

    min-height:430px;

    white-space:normal;

    text-align:left;

    letter-spacing:.1px;
}

/* paragraphs */

.story-text p{
    margin-bottom:25px;
}

.story-text .quote{
    margin:32px 0;
    padding:20px 28px;

    border-left:
        2px solid rgba(130,205,240,.45);

    color:#bfe7f8;

    background:
        linear-gradient(
            90deg,
            rgba(100,170,205,.06),
            transparent
        );

    font-style:italic;
}

.story-text strong{
    color:#f3fbff;
    font-weight:500;
}

/* =========================================================
   CURSOR
========================================================= */

.cursor{
    display:inline-block;

    width:2px;
    height:1.1em;

    margin-left:4px;

    background:#bfeaff;

    vertical-align:-3px;

    animation:blink .7s infinite;
}

@keyframes blink{

    50%{
        opacity:0;
    }
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-area{
    padding:
        0
        90px
        25px;
}

.progress-top{

    display:flex;

    justify-content:space-between;

    color:#687d8b;

    font-size:10px;

    letter-spacing:3px;

    margin-bottom:8px;
}

.progress{

    height:2px;

    background:
        rgba(180,220,240,.08);
}

.progress-bar{

    height:100%;

    width:0;

    background:
        linear-gradient(
            90deg,
            #578aaa,
            #d8f5ff
        );

    box-shadow:
        0 0 15px rgba(130,210,245,.35);

    transition:
        width .8s ease;
}

/* =========================================================
   CONTINUE
========================================================= */

.continue-area{

    display:flex;

    justify-content:center;

    padding:
        5px
        90px
        45px;
}

.read-btn{

    min-width:240px;

    padding:14px 32px;

    border:
        1px solid rgba(190,230,250,.22);

    border-radius:999px;

    background:
        rgba(130,190,220,.055);

    color:#eaf8ff;

    font-family:'Kanit',sans-serif;

    font-size:15px;

    cursor:pointer;

    transition:.3s;
}

.read-btn:hover{

    transform:translateY(-2px);

    background:
        rgba(130,200,235,.13);

    border-color:
        rgba(210,240,255,.5);

    box-shadow:
        0 0 30px rgba(100,190,230,.12);
}

.read-btn.hidden{
    display:none;
}

/* =========================================================
   CHOICES
========================================================= */

.choices{

    display:flex;

    flex-direction:column;

    gap:12px;

    padding:
        0
        90px
        50px;

    animation:fadeIn .7s ease;
}

.choice{

    position:relative;

    padding:
        19px
        24px;

    border:
        1px solid rgba(180,225,245,.13);

    border-radius:15px;

    background:
        rgba(11,25,37,.65);

    color:#dcecf4;

    font-family:'Kanit',sans-serif;

    font-size:16px;

    text-align:left;

    cursor:pointer;

    transition:.3s;

    overflow:hidden;
}

.choice::before{

    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:3px;

    background:transparent;

    transition:.3s;
}

.choice:hover{

    transform:translateX(7px);

    border-color:
        rgba(180,225,245,.38);

    background:
        rgba(25,48,64,.75);
}

.choice:hover::before{

    background:#8dd3f2;

    box-shadow:
        0 0 15px #8dd3f2;
}

/* =========================================================
   START SCREEN
========================================================= */

.start-screen{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(42,78,101,.18),
            transparent 42%
        ),
        rgba(2,6,11,.97);

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.start-screen.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.start-content{

    width:min(720px,calc(100% - 35px));

    text-align:center;
}

.start-small{

    font-size:11px;

    letter-spacing:7px;

    color:#83b7cf;

    margin-bottom:20px;
}

.start-title{

    font-family:'Itim',cursive;

    font-size:78px;

    letter-spacing:9px;

    color:#eefaff;

    text-shadow:
        0 0 25px rgba(170,225,250,.13),
        0 0 80px rgba(100,180,220,.08);

    animation:titleFloat 4s ease-in-out infinite;
}

@keyframes titleFloat{

    50%{
        transform:translateY(-5px);
    }
}

.start-sub{

    color:#91a7b4;

    margin:
        12px
        0
        42px;

    font-size:15px;

    line-height:1.9;
}

.start-btn{

    padding:
        15px
        55px;

    border-radius:999px;

    border:
        1px solid rgba(190,230,250,.28);

    background:
        rgba(120,185,215,.08);

    color:#eaf8ff;

    font-family:'Kanit',sans-serif;

    font-size:16px;

    cursor:pointer;

    transition:.3s;

    position:relative;

    z-index:2;
}

.start-btn:hover{

    transform:translateY(-3px);

    background:
        rgba(130,200,235,.16);

    border-color:
        rgba(210,240,255,.6);

    box-shadow:
        0 0 35px rgba(100,190,230,.13);
}

.start-line{

    width:80px;

    height:1px;

    margin:
        35px
        auto
        0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #a9dff5,
            transparent
        );
}

/* =========================================================
   ENDING
========================================================= */

.end-screen{

    text-align:center;

    padding:
        45px
        20px
        60px;
}

.end-icon{

    font-size:52px;

    margin-bottom:15px;

    animation:endFloat 3s ease-in-out infinite;
}

@keyframes endFloat{

    50%{
        transform:translateY(-7px);
    }
}

.end-title{

    font-family:'Itim',cursive;

    font-size:48px;

    letter-spacing:4px;

    color:#edfaff;

    margin-bottom:25px;
}

.end-text{

    max-width:700px;

    margin:auto;

    font-family:'Noto Serif Thai',serif;

    font-size:18px;

    font-weight:300;

    line-height:2.15;

    color:#cbdce4;

    white-space:normal;

    text-align:left;
}

.end-text p{
    margin-bottom:25px;
}

.end-actions{

    margin-top:40px;

    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;
}

.end-btn{

    padding:
        12px
        27px;

    border-radius:999px;

    border:
        1px solid rgba(190,230,250,.18);

    background:
        rgba(130,190,220,.06);

    color:#e8f8ff;

    font-family:'Kanit',sans-serif;

    cursor:pointer;

    transition:.3s;
}

.end-btn:hover{

    transform:translateY(-2px);

    background:
        rgba(130,190,220,.13);
}

/* =========================================================
   ANIMATION
========================================================= */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes chapterIn{

    from{
        opacity:0;
        transform:translateY(-10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .topbar{
        height:60px;
        padding:0 16px;
    }

    .logo{
        font-size:10px;
        letter-spacing:4px;
    }

    .control-btn{
        width:36px;
        height:36px;
    }

    .game{
        width:calc(100% - 16px);
        padding-top:85px;
    }

    .chapter-title{
        font-size:35px;
    }

    .story-content{
        padding:
            40px
            25px
            30px;
    }

    .story-text{

        font-size:17px;

        line-height:2.05;

        min-height:430px;
    }

    .story-text .quote{
        padding:
            15px
            18px;
    }

    .progress-area{
        padding:
            0
            25px
            20px;
    }

    .continue-area{
        padding:
            0
            25px
            30px;
    }

    .choices{
        padding:
            0
            25px
            35px;
    }

    .choice{
        font-size:14px;
    }

    .moon{
        width:150px;
        height:150px;
        right:-35px;
        top:90px;
        opacity:.3;
    }

    .start-title{
        font-size:48px;
        letter-spacing:5px;
    }

    .start-small{
        letter-spacing:4px;
    }

    .start-sub{
        font-size:13px;
    }

    .end-title{
        font-size:36px;
    }

    .end-text{
        font-size:16px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background">
    <div class="moon"></div>
    <div class="fog"></div>
</div>

<div class="snow" id="snow"></div>


<!-- TOP BAR -->

<header class="topbar">

    <div class="logo">
        WINTER <span>MEMORY</span>
    </div>

    <div class="controls">

        <button
            class="control-btn"
            id="soundBtn"
            type="button"
            title="เปิด/ปิดเสียง">
            🔊
        </button>

        <button
            class="control-btn"
            id="restartBtn"
            type="button"
            title="เริ่มเกมใหม่">
            ↻
        </button>

    </div>

</header>


<!-- START SCREEN -->

<div class="start-screen" id="startScreen">

    <div class="start-content">

        <div class="start-small">
            A STORY OF LOVE & MEMORY
        </div>

        <div class="start-title">
            WINTER MEMORY
        </div>

        <div class="start-sub">
            บางความทรงจำอาจหายไปกับกาลเวลา<br>
            แต่บางคำสัญญา...กลับรอคอยเราอยู่ในคืนที่หิมะแรกตก
        </div>

        <button
            class="start-btn"
            id="startBtn"
            type="button">
            ❄ เริ่มเรื่องราว
        </button>

        <div class="start-line"></div>

    </div>

</div>


<!-- GAME -->

<main class="game">

    <section class="scene">

        <div class="chapter">

            <div
                class="chapter-number"
                id="chapterNumber">
                PROLOGUE
            </div>

            <div
                class="chapter-title"
                id="chapterTitle">
                จดหมายที่ไม่ควรกลับมา
            </div>

        </div>


        <div class="story-box">

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>


            <div class="story-content">

                <div
                    class="story-text"
                    id="storyText">
                </div>

            </div>


            <div class="progress-area">

                <div class="progress-top">

                    <span>
                        MEMORY
                    </span>

                    <span id="progressText">
                        0%
                    </span>

                </div>

                <div class="progress">

                    <div
                        class="progress-bar"
                        id="progressBar">
                    </div>

                </div>

            </div>


            <div class="continue-area">

                <button
                    class="read-btn"
                    id="continueBtn"
                    type="button">

                    อ่านต่อ

                </button>

            </div>


            <div
                class="choices"
                id="choices">
            </div>

        </div>

    </section>

</main>


<script>

/* =========================================================
   SAFE AUDIO
   เสียงจะไม่ทำให้เกมพังถ้าบราวเซอร์ไม่รองรับ
========================================================= */

let audioEnabled = true;
let audioContext = null;

function initAudio(){

    try{

        if(!audioContext){

            const AudioCtx =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AudioCtx){
                return false;
            }

            audioContext = new AudioCtx();
        }

        if(audioContext.state === "suspended"){
            audioContext.resume().catch(()=>{});
        }

        return true;

    }catch(error){

        console.log("Audio unavailable");
        return false;

    }

}


function playTone(
    frequency=500,
    duration=.05,
    type="sine",
    volume=.02
){

    if(!audioEnabled) return;

    try{

        if(!initAudio()) return;

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = type;

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + duration
        );

    }catch(error){

        console.log("Sound error");

    }

}


function clickSound(){

    playTone(
        480,
        .045,
        "sine",
        .025
    );

    setTimeout(()=>{

        playTone(
            720,
            .035,
            "sine",
            .018
        );

    },30);

}


function typeSound(){

    if(Math.random() > .25){

        playTone(
            500 + Math.random()*100,
            .018,
            "triangle",
            .006
        );

    }

}


function choiceSound(){

    playTone(
        350,
        .06,
        "sine",
        .025
    );

    setTimeout(()=>{

        playTone(
            600,
            .09,
            "sine",
            .018
        );

    },50);

}


/* =========================================================
   SNOW
========================================================= */

const snow =
    document.getElementById("snow");

for(let i=0;i<90;i++){

    const flake =
        document.createElement("div");

    flake.className =
        "snowflake";

    flake.textContent =
        Math.random() > .45
        ? "•"
        : "❄";

    flake.style.left =
        Math.random()*100 + "%";

    flake.style.fontSize =
        (Math.random()*7+3) + "px";

    flake.style.opacity =
        Math.random()*.65+.15;

    flake.style.animationDuration =
        (Math.random()*12+8) + "s";

    flake.style.animationDelay =
        (Math.random()*12) + "s";

    snow.appendChild(flake);

}


/* =========================================================
   STORY
========================================================= */

const STORY = {

prologue:{

chapter:"PROLOGUE",

title:"จดหมายที่ไม่ควรกลับมา",

progress:5,

text:`

<p>

/* =========================================================
   VARIABLES
========================================================= */

let currentScene = "prologue";

let isTyping = false;

let skipTyping = false;

let typeTimer = null;


const storyText =
    document.getElementById("storyText");

const chapterNumber =
    document.getElementById("chapterNumber");

const chapterTitle =
    document.getElementById("chapterTitle");

const choices =
    document.getElementById("choices");

const continueBtn =
    document.getElementById("continueBtn");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const startScreen =
    document.getElementById("startScreen");

const startBtn =
    document.getElementById("startBtn");

const soundBtn =
    document.getElementById("soundBtn");

const restartBtn =
    document.getElementById("restartBtn");


/* =========================================================
   TYPEWRITER
========================================================= */

function typeText(html,callback){

    clearTimeout(typeTimer);

    isTyping = true;
    skipTyping = false;

    storyText.innerHTML = "";

    /*
       แปลง HTML เป็นข้อความทีละตัว
       แต่ตอนแสดงผลจะยังคงเป็นรูปแบบนิยาย
    */

    const temp =
        document.createElement("div");

    temp.innerHTML = html;

    const plainText =
        temp.innerText;

    let index = 0;

    const cursor =
        document.createElement("span");

    cursor.className = "cursor";

    storyText.appendChild(cursor);


    function finish(){

        clearTimeout(typeTimer);

        storyText.innerHTML = html;

        isTyping = false;

        if(callback){
            callback();
        }

    }


    function type(){

        if(skipTyping){

            finish();

            return;
        }


        if(index >= plainText.length){

            finish();

            return;
        }


        const char =
            plainText.charAt(index);

        cursor.before(
            document.createTextNode(char)
        );

        index++;


        if(char.trim() !== ""){
            typeSound();
        }


        let speed = 15;


        if(
            char === "." ||
            char === "!" ||
            char === "?"
        ){
            speed = 150;
        }


        if(
            char === "。" ||
            char === "…" 
        ){
            speed = 180;
        }


        if(char === "\n"){
            speed = 60;
        }


        typeTimer =
            setTimeout(
                type,
                speed
            );

    }


    type();

}


/* =========================================================
   SHOW SCENE
========================================================= */

function showScene(sceneId){

    const scene =
        STORY[sceneId];

    if(!scene) return;

    currentScene =
        sceneId;


    try{

        localStorage.setItem(
            "winterMemoryScene",
            sceneId
        );

    }catch(error){}


    chapterNumber.textContent =
        scene.chapter;

    chapterTitle.textContent =
        scene.title;

    progressBar.style.width =
        scene.progress + "%";

    progressText.textContent =
        scene.progress + "%";


    choices.innerHTML = "";

    continueBtn.classList.add(
        "hidden"
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });


    typeText(
        scene.text,
        ()=>{

            if(scene.ending){

                showEnding(scene);

            }else{

                continueBtn.classList.remove(
                    "hidden"
                );

            }

        }
    );

}


/* =========================================================
   CONTINUE
========================================================= */

continueBtn.addEventListener(
    "click",
    function(){

        if(isTyping){

            skipTyping = true;

            return;
        }

        clickSound();

        const scene =
            STORY[currentScene];

        if(scene){

            showChoices(scene);

        }

    }
);


/* =========================================================
   CHOICES
========================================================= */

function showChoices(scene){

    continueBtn.classList.add(
        "hidden"
    );

    choices.innerHTML = "";


    scene.choices.forEach(
        (choice,index)=>{

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "choice";

            button.textContent =
                choice.text;

            button.style.animation =
                `fadeIn .5s ease ${index*.1}s both`;


            button.addEventListener(
                "click",
                function(){

                    choiceSound();

                    showScene(
                        choice.next
                    );

                }
            );


            choices.appendChild(
                button
            );

        }
    );


    setTimeout(()=>{

        choices.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    },100);

}


/* =========================================================
   ENDING
========================================================= */

function showEnding(scene){

    continueBtn.classList.add(
        "hidden"
    );

    choices.innerHTML = "";


    const end =
        document.createElement("div");

    end.className =
        "end-screen";


    const icon =
        document.createElement("div");

    icon.className =
        "end-icon";

    icon.textContent =
        scene.icon || "❄️";


    const title =
        document.createElement("div");

    title.className =
        "end-title";

    title.textContent =
        scene.title;


    const text =
        document.createElement("div");

    text.className =
        "end-text";

    text.innerHTML =
        scene.text;


    const actions =
        document.createElement("div");

    actions.className =
        "end-actions";


    const restart =
        document.createElement("button");

    restart.type = "button";

    restart.className =
        "end-btn";

    restart.textContent =
        "↻ เล่นเรื่องนี้ใหม่";


    restart.addEventListener(
        "click",
        function(){

            clickSound();

            restartGame();

        }
    );


    const top =
        document.createElement("button");

    top.type = "button";

    top.className =
        "end-btn";

    top.textContent =
        "↑ กลับด้านบน";


    top.addEventListener(
        "click",
        function(){

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }
    );


    actions.appendChild(
        restart
    );

    actions.appendChild(
        top
    );


    end.appendChild(icon);

    end.appendChild(title);

    end.appendChild(text);

    end.appendChild(actions);


    choices.appendChild(end);


    setTimeout(()=>{

        choices.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    },200);

}


/* =========================================================
   START GAME
   สำคัญ: ไม่ให้ Audio ขัดการเริ่มเกม
========================================================= */

startBtn.addEventListener(
    "click",
    function(){

        /*
           ห้ามให้เสียงทำให้ปุ่มเริ่มพัง
        */

        try{
            initAudio();
            clickSound();
        }catch(error){
            console.log(error);
        }


        startScreen.classList.add(
            "hide"
        );


        setTimeout(
            function(){

                showScene(
                    "prologue"
                );

            },
            400
        );

    }
);


/* =========================================================
   SOUND BUTTON
========================================================= */

soundBtn.addEventListener(
    "click",
    function(){

        audioEnabled =
            !audioEnabled;


        soundBtn.textContent =
            audioEnabled
            ? "🔊"
            : "🔇";


        if(audioEnabled){

            initAudio();

            clickSound();

        }

    }
);


/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener(
    "click",
    function(){

        try{
            clickSound();
        }catch(error){}


        restartGame();

    }
);


function restartGame(){

    clearTimeout(typeTimer);

    isTyping = false;

    skipTyping = false;

    currentScene =
        "prologue";


    try{

        localStorage.removeItem(
            "winterMemoryScene"
        );

    }catch(error){}


    storyText.innerHTML = "";

    choices.innerHTML = "";


    progressBar.style.width =
        "0%";

    progressText.textContent =
        "0%";


    chapterNumber.textContent =
        "PROLOGUE";

    chapterTitle.textContent =
        "จดหมายที่ไม่ควรกลับมา";


    continueBtn.classList.add(
        "hidden"
    );


    startScreen.classList.remove(
        "hide"
    );

}


/* =========================================================
   CLICK STORY TO SKIP
========================================================= */

storyText.addEventListener(
    "click",
    function(){

        if(isTyping){

            skipTyping = true;

        }

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.code !== "Space"){
            return;
        }


        event.preventDefault();


        if(isTyping){

            skipTyping = true;

            return;

        }


        if(
            !continueBtn.classList.contains(
                "hidden"
            )
        ){

            continueBtn.click();

        }

    }
);


/* =========================================================
   START STATE
========================================================= */

/*
   ตอนเปิดเว็บจะยังไม่โหลดเนื้อเรื่อง
   ต้องกด "เริ่มเรื่องราว" ก่อน
*/

continueBtn.classList.add(
    "hidden"
);

</script>
