<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnowMemories: ความทรงจำในสายลมหนาว</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Prompt:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
            user-select: none;
        }

        body {
            background: #030508;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Screen Shake Effect */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(3, 5, 8, 0.88), rgba(12, 17, 28, 0.96)),
                        url('https://images.unsplash.com/photo-1517299321609-52687d1bc55a?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            z-index: 1;
        }

        #snow-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .game-card {
            background: rgba(8, 12, 20, 0.94);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 20px rgba(212, 175, 55, 0.12);
            border-radius: 20px;
            width: 100%;
            max-width: 880px;
            padding: 45px;
            position: relative;
            z-index: 3;
            backdrop-filter: blur(16px);
            transition: all 0.5s ease;
        }

        /* Ending Card Themes */
        .game-card.end-sad {
            border-color: rgba(147, 197, 253, 0.6);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(147, 197, 253, 0.25);
        }
        .game-card.end-bad {
            border-color: rgba(239, 68, 68, 0.6);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(239, 68, 68, 0.25);
        }
        .game-card.end-bitter {
            border-color: rgba(251, 191, 36, 0.6);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(251, 191, 36, 0.25);
        }

        /* Start Screen Styling */
        #start-screen {
            text-align: center;
            padding: 30px 15px;
            position: relative;
        }

        .decor-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .season-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #d4af37;
            padding: 6px 22px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 3px;
            margin-bottom: 22px;
            font-family: 'Prompt', sans-serif;
            text-transform: uppercase;
        }

        .title {
            font-family: 'Prompt', sans-serif;
            font-size: 44px;
            color: #f8fafc;
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            font-weight: 600;
        }

        .subtitle {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 45px;
            font-style: italic;
            line-height: 1.9;
            font-weight: 300;
        }

        .btn-main {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #d4af37 0%, #997409 100%);
            color: #030508;
            border: none;
            padding: 18px 55px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(212, 175, 55, 0.35);
            transition: all 0.35s ease;
            letter-spacing: 1px;
        }

        .btn-main:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #f3ca52 0%, #b88e0e 100%);
        }

        /* Game Screen Styling */
        #game-screen { display: none; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 18px;
            margin-bottom: 28px;
            font-size: 14px;
            color: #94a3b8;
        }

        .evidence-tag {
            color: #d4af37;
            font-weight: 600;
            font-family: 'Prompt', sans-serif;
            letter-spacing: 0.5px;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.25s;
        }

        .btn-back:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
            color: #fff;
        }

        .story-box {
            font-size: 17.5px;
            line-height: 2.1;
            color: #f1f5f9;
            margin-bottom: 35px;
            min-height: 240px;
            font-weight: 300;
        }

        /* Paragraph Hover Styling */
        .story-p {
            padding: 6px 12px;
            margin: 4px 0;
            border-radius: 6px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .story-p:hover {
            background: rgba(212, 175, 55, 0.12);
            color: #ffffff;
            box-shadow: inset 3px 0 0 #d4af37;
        }

        .choices-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-choice {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.22);
            color: #cbd5e1;
            padding: 17px 26px;
            font-size: 15.5px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        .btn-choice:hover {
            background: rgba(212, 175, 55, 0.16);
            border-color: #d4af37;
            color: #ffffff;
            padding-left: 34px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
        }

        /* Ending Banner Decoration */
        .ending-badge {
            display: inline-block;
            font-family: 'Prompt', sans-serif;
            font-size: 20px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .badge-sad { background: rgba(147, 197, 253, 0.15); color: #93c5fd; border: 1px solid #93c5fd; }
        .badge-bad { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #f87171; }
        .badge-bitter { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid #fbbf24; }
    </style>
</head>
<body>

<div class="bg-overlay"></div>
<canvas id="snow-canvas"></canvas>

<div class="game-card" id="main-card">
    <div id="start-screen">
        <div class="decor-glow"></div>
        <div class="season-badge">🍂 AUTUMN TO WINTER ❄️</div>
        <div class="title">SnowMemories</div>
        <div class="subtitle">"ความทรงจำในสายลมหนาว: ท่ามกลางใบไม้สีเหลืองหม่นที่ลอยปลิว และเกล็ดหิมะแรกอันเยียบเย็น...<br>เงาร่างของชายคนเดียวที่คุณรักสุดหัวใจ จะนำพาไปสู่ความจริงอันแสนอบอุ่น หรือโศกนาฏกรรมที่ไม่ติดอยู่ในความทรงจำอีกเลย"</div>
        <button class="btn-main" onclick="startGame()">เริ่มการสืบสวน</button>
    </div>

    <div id="game-screen">
        <div class="status-bar">
            <span id="case-title">🍁 SnowMemories: ความทรงจำในสายลมหนาว</span>
            <span class="evidence-tag" id="evidence-text">ระดับความจริง: 0%</span>
            <button class="btn-back" id="back-btn" onclick="goBack()">↩️ ย้อนกลับ</button>
        </div>
        <div id="ending-badge-container"></div>
        <div class="story-box" id="story-display"></div>
        <div class="choices-grid" id="choices-display"></div>
    </div>
</div>

<script>
// Web Audio SFX Synthesizer
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSFX(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;

    if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);

    } else if (type === 'paper') {
        const bufferSize = audioCtx.sampleRate * 0.12;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, now);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.12);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start(now);

    } else if (type === 'phone') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.setValueAtTime(1000, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);

    } else if (type === 'gunshot') {
        triggerScreenShake();
        const bufferSize = audioCtx.sampleRate * 0.6;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3000, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + 0.5);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start(now);

    } else if (type === 'explosion') {
        triggerScreenShake();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.8);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);

    } else if (type === 'heartbeat') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(75, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.18);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.18);
        osc.start(now); osc.stop(now + 0.18);

    } else if (type === 'wind') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(380, now + 0.3);
        osc.frequency.linearRampToValueAtTime(180, now + 0.6);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.08, now + 0.3);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
    }
}

function triggerScreenShake() {
    const card = document.getElementById('main-card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
}

// Hover Text-To-Speech & Auto Sound Detection
let currentUtterance = null;

function speakAndTriggerSound(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // หยุดเสียงอ่านเก่าถ้ามี
        
        // ตรวจจับคำสำคัญในข้อความเพื่อเล่น SFX ที่ตรงกัน
        if (text.includes("ปืน") || text.includes("กระสุน") || text.includes("ยิง") || text.includes("ปัง")) {
            playSFX('gunshot');
        } else if (text.includes("โทรศัพท์") || text.includes("ข้อความ") || text.includes("สั่น") || text.includes("ไซเรน")) {
            playSFX('phone');
        } else if (text.includes("หัวใจ") || text.includes("กอด") || text.includes("ลมหายใจ") || text.includes("ตื่นเต้น")) {
            playSFX('heartbeat');
        } else if (text.includes("ระเบิด") || text.includes("เปลวไฟ")) {
            playSFX('explosion');
        } else if (text.includes("ลม") || text.includes("หิมะ") || text.includes("คลื่น")) {
            playSFX('wind');
        } else if (text.includes("นาฬิกา") || text.includes("เอกสาร") || text.includes("ข้อความ")) {
            playSFX('paper');
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'th-TH';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        // ดึงเสียงภาษาไทยถ้ามี
        const voices = window.speechSynthesis.getVoices();
        const thVoice = voices.find(v => v.lang.includes('th'));
        if (thVoice) utterance.voice = thVoice;

        window.speechSynthesis.speak(utterance);
    }
}

function stopSpeech() {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
}

// Snow Canvas
const canvas = document.getElementById('snow-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const flakes = Array.from({ length: 65 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 3 + 1,
    d: Math.random() * 0.8 + 0.4
}));

function drawSnow() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
    ctx.beginPath();
    for (let f of flakes) {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
    }
    ctx.fill();
    moveSnow();
}

function moveSnow() {
    for (let f of flakes) {
        f.y += Math.pow(f.d, 2) + 0.4;
        f.x += Math.sin(f.y / 35);
        if (f.y > height) {
            f.y = -10;
            f.x = Math.random() * width;
        }
    }
}
setInterval(drawSnow, 33);

// Game Story Data & Logic

        "evidence": 15,
        "sfx": "paper",
        "choices": [
            {"text": "1. ลองใช้แว่นขยายตรวจดูรอยขีดข่วนและรอยนิ้วมือบนตัวเรือนนาฬิกาอย่างละเอียด", "next": "fingerprint"},
            {"text": "2. ถอดฝาหลังนาฬิกาออก เพื่อดูเครื่องติดตามพิกัดตำแหน่งที่คุณเคยแอบซ่อนไว้ข้างใน", "next": "gps"}

        "text": "[ความทรงจำที่เริ่มแจ่มชัด]\nรอยนิ้วมือบนหน้าปัดนาฬิกาคือรอยนิ้วมือของ 'ธันน์' จริงๆ... ความทรงจำในวันเก่าพร่างพรูเข้ามา ในวันที่หิมะตกหนัก ธันน์เคยยิ้มแล้วลูบหัวคุณเบาๆ 'ถ้าวันไหนเราต้องห่างกัน นาฬิกาเรือนนี้จะนำทางให้เรากลับมาพบกันนะ'\n\nแต่เมื่อคุณเช็กข้อมูลในคลังของตำรวจ ชื่อของเขากลับถูกระบุว่าเป็น 'บุคคลอันตราย' ที่มีคำสั่งให้จับกุมด่วน\n\nทันใดนั้น โทรศัพท์ของคุณก็สั่น มีข้อความจากเบอร์แปลกส่งเข้ามา:\n'หิมะแรกตกแล้วนะเรย์... ความจริงเรื่องนี้มันเจ็บปวดเกินกว่าที่นายจะรับไหว อย่าตามหาฉันอีกเลย หันหลังกลับไปซะ'",
        "evidence": 35,
        "sfx": "paper",
        "choices": [

            {"text": "2. แจ้งตำรวจและส่งตำแหน่งให้เจ้าหน้าที่รีบนำกำลังไปล้อมจับตัวเขา", "next": "call_police"}

let historyStack = [];

function startGame() {
    playSFX('click');
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    historyStack = [];
    renderScene("start", false);
}

function renderScene(sceneKey, isGoingBack = false) {
    stopSpeech();
    const scene = STORY_DATA[sceneKey];
    if (!scene) return;

    if (scene.sfx) playSFX(scene.sfx);

    if (!isGoingBack && (historyStack.length === 0 || historyStack[historyStack.length - 1] !== sceneKey)) {
        historyStack.push(sceneKey);
    }

    const card = document.getElementById("main-card");
    const badgeContainer = document.getElementById("ending-badge-container");
    badgeContainer.innerHTML = "";
    card.className = "game-card";

    if (scene.type) {
        document.getElementById("back-btn").style.display = "none";
        document.getElementById("case-title").innerText = `บทสรุป: ${scene.title}`;
        
        let badgeClass = "badge-sad";
        if (scene.type === "bad") { card.classList.add("end-bad"); badgeClass = "badge-bad"; }
        else if (scene.type === "sad") { card.classList.add("end-sad"); badgeClass = "badge-sad"; }
        else if (scene.type === "bitter") { card.classList.add("end-bitter"); badgeClass = "badge-bitter"; }

        badgeContainer.innerHTML = `<div class="ending-badge ${badgeClass}">${scene.badge}</div>`;
    } else {
        document.getElementById("back-btn").style.display = historyStack.length > 1 ? "inline-block" : "none";
        document.getElementById("case-title").innerText = "🍁 SnowMemories: ความทรงจำในสายลมหนาว";
    }

    const totalEvidence = Math.min(100, scene.evidence || 0);
    document.getElementById("evidence-text").innerText = `ระดับความจริง: ${totalEvidence}%`;
    
    // แบ่งเนื้อเรื่องออกเป็นย่อหน้า และใส่ Event ชี้เมาส์ (Hover)
    const storyContainer = document.getElementById("story-display");
    storyContainer.innerHTML = "";
    
    const paragraphs = scene.text.split("\n\n");
    paragraphs.forEach(paraText => {
        if (paraText.trim()) {
            const p = document.createElement("p");
            p.className = "story-p";
            p.innerText = paraText;
            p.onmouseenter = () => speakAndTriggerSound(paraText);
            p.onmouseleave = () => stopSpeech();
            storyContainer.appendChild(p);
        }
    });

    const choicesContainer = document.getElementById("choices-display");
    choicesContainer.innerHTML = "";

    if (scene.choices && scene.choices.length > 0) {
        scene.choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "btn-choice";
            btn.innerText = choice.text;
            btn.onmouseenter = () => speakAndTriggerSound(choice.text);
            btn.onmouseleave = () => stopSpeech();
            btn.onclick = () => renderScene(choice.next, false);
            choicesContainer.appendChild(btn);
        });
    } else {
        const restartBtn = document.createElement("button");
        restartBtn.className = "btn-main";
        restartBtn.style.marginTop = "25px";
        restartBtn.innerText = "🔄 เริ่มต้นย้อนเวลาสืบสวนใหม่";
        restartBtn.onclick = () => {
            playSFX('click');
            stopSpeech();
            historyStack = [];
            document.getElementById("game-screen").style.display = "none";
            document.getElementById("start-screen").style.display = "block";
            card.className = "game-card";
        };
        choicesContainer.appendChild(restartBtn);
    }
}

function goBack() {
    if (historyStack.length > 1) {
        playSFX('click');
        stopSpeech();
        historyStack.pop();
        const previousScene = historyStack[historyStack.length - 1];
        renderScene(previousScene, true);
    }
}
