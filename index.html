<!DOCTYPE html>

<head>

    <style>

        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
            user-select: none;
        }

        body {
            background: #030508;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Screen Shake Effect */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(3, 5, 8, 0.85), rgba(12, 17, 28, 0.95)),
                        url('https://images.unsplash.com/photo-1517299321609-52687d1bc55a?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            z-index: 1;
        }

        #snow-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .game-card {
            background: rgba(8, 12, 20, 0.93);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 20px rgba(212, 175, 55, 0.12);
            border-radius: 20px;
            width: 100%;
            max-width: 840px;
            padding: 45px;
            position: relative;
            z-index: 3;
            backdrop-filter: blur(16px);
            transition: all 0.5s ease;
        }

        /* Ending Card Themes */
        .game-card.end-sad {
            border-color: rgba(147, 197, 253, 0.6);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(147, 197, 253, 0.25);
        }
        .game-card.end-bad {
            border-color: rgba(239, 68, 68, 0.6);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(239, 68, 68, 0.25);
        }
        .game-card.end-bitter {
            border-color: rgba(251, 191, 36, 0.6);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(251, 191, 36, 0.25);

            text-align: center;

<script>
// Web Audio Dynamic Contextual SFX Synthesizer
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSFX(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;

    if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);

    } else if (type === 'paper') {
        const bufferSize = audioCtx.sampleRate * 0.12;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, now);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.12);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start(now);

    } else if (type === 'gunshot') {
        triggerScreenShake();
        const bufferSize = audioCtx.sampleRate * 0.6;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3000, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + 0.5);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start(now);

    } else if (type === 'explosion') {
        triggerScreenShake();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.8);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);

    } else if (type === 'heartbeat') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(75, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.18);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.18);
        osc.start(now); osc.stop(now + 0.18);

    } else if (type === 'wind') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(380, now + 0.3);
        osc.frequency.linearRampToValueAtTime(180, now + 0.6);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.08, now + 0.3);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
    }
}

function triggerScreenShake() {
    const card = document.getElementById('main-card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
}

// Snow Particle System
const canvas = document.getElementById('snow-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const flakes = Array.from({ length: 65 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 3 + 1,
    d: Math.random() * 0.8 + 0.4
}));

function drawSnow() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
    ctx.beginPath();
    for (let f of flakes) {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
    }
    ctx.fill();
    moveSnow();
}

function moveSnow() {
    for (let f of flakes) {
        f.y += Math.pow(f.d, 2) + 0.4;
        f.x += Math.sin(f.y / 35);
        if (f.y > height) {
            f.y = -10;
            f.x = Math.random() * width;
        }
    }
}
setInterval(drawSnow, 33);

let historyStack = [];

function startGame() {
    playSFX('click');
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    historyStack = [];
    renderScene("start", false);
}

function renderScene(sceneKey, isGoingBack = false) {
    const scene = STORY_DATA[sceneKey];
    if (!scene) return;

    if (scene.sfx) playSFX(scene.sfx);

    if (!isGoingBack && (historyStack.length === 0 || historyStack[historyStack.length - 1] !== sceneKey)) {
        historyStack.push(sceneKey);
    }

    const card = document.getElementById("main-card");
    const badgeContainer = document.getElementById("ending-badge-container");
    badgeContainer.innerHTML = "";
    card.className = "game-card";

    if (scene.type) {
        document.getElementById("back-btn").style.display = "none";
        document.getElementById("case-title").innerText = `บทสรุป: ${scene.title}`;
        
        let badgeClass = "badge-sad";
        if (scene.type === "bad") { card.classList.add("end-bad"); badgeClass = "badge-bad"; }
        else if (scene.type === "sad") { card.classList.add("end-sad"); badgeClass = "badge-sad"; }
        else if (scene.type === "bitter") { card.classList.add("end-bitter"); badgeClass = "badge-bitter"; }

        badgeContainer.innerHTML = `<div class="ending-badge ${badgeClass}">${scene.badge}</div>`;
    } else {
        document.getElementById("back-btn").style.display = historyStack.length > 1 ? "inline-block" : "none";
        document.getElementById("case-title").innerText = "🍁 SnowMemories: ความทรงจำในสายลมหนาว";
    }

    const totalEvidence = Math.min(100, scene.evidence || 0);
    document.getElementById("evidence-text").innerText = `ระดับความจริง: ${totalEvidence}%`;
    document.getElementById("story-display").innerText = scene.text;

    const choicesContainer = document.getElementById("choices-display");
    choicesContainer.innerHTML = "";

    if (scene.choices && scene.choices.length > 0) {
        scene.choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "btn-choice";
            btn.innerText = choice.text;
            btn.onclick = () => renderScene(choice.next, false);
            choicesContainer.appendChild(btn);
        });
    } else {
        const restartBtn = document.createElement("button");
        restartBtn.className = "btn-main";
        restartBtn.style.marginTop = "25px";
        restartBtn.innerText = "🔄 เริ่มต้นย้อนเวลาสืบสวนใหม่";
        restartBtn.onclick = () => {
            playSFX('click');
            historyStack = [];
            document.getElementById("game-screen").style.display = "none";
            document.getElementById("start-screen").style.display = "block";
            card.className = "game-card";
        };
        choicesContainer.appendChild(restartBtn);
    }
}

function goBack() {
    if (historyStack.length > 1) {
        playSFX('click');
        historyStack.pop();
        const previousScene = historyStack[historyStack.length - 1];
        renderScene(previousScene, true);
    }
}
