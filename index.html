<script>

/* ================= SNOW EFFECT ================= */

const snowCanvas = document.getElementById("snow");

const snowCtx = snowCanvas.getContext("2d");

let width = snowCanvas.width = window.innerWidth;

let height = snowCanvas.height = window.innerHeight;

window.addEventListener("resize", () => {

    width = snowCanvas.width = window.innerWidth;

    height = snowCanvas.height = window.innerHeight;

});

const flakes = [];

for(let i=0;i<180;i++){

    flakes.push({

        x:Math.random()*width,

        y:Math.random()*height,

        r:Math.random()*3+1,

        speed:Math.random()*2+0.5,

        drift:Math.random()*2-1

    });

}

function drawSnow(){

    snowCtx.clearRect(0,0,width,height);

    snowCtx.fillStyle="rgba(255,255,255,.8)";

    flakes.forEach(f=>{

        snowCtx.beginPath();

        snowCtx.arc(f.x,f.y,f.r,0,Math.PI*2);

        snowCtx.fill();

        f.y+=f.speed;

        f.x+=f.drift;

        if(f.y>height){

            f.y=-10;

            f.x=Math.random()*width;

        }

    });

    requestAnimationFrame(drawSnow);

}

drawSnow();

/* ================= STAR EFFECT ================= */

const stars=document.getElementById("stars");

for(let i=0;i<80;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"%";

    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=Math.random()*4+"s";

    stars.appendChild(star);

}

/* ================= PARALLAX ================= */

document.addEventListener("mousemove",e=>{

    const x=e.clientX/window.innerWidth;

    const y=e.clientY/window.innerHeight;

    document.querySelector(".background").style.transform=

    `translate(${x*15}px,${y*15}px)`;

});

/* ================= SOUND ================= */

const audioContext=new(

window.AudioContext||

window.webkitAudioContext

)();

function playSound(type){

    if(audioContext.state==="suspended"){

        audioContext.resume();

    }

    const oscillator=

    audioContext.createOscillator();

    const gain=

    audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    const now=audioContext.currentTime;

    if(type==="click"){

        oscillator.frequency.value=400;

        gain.gain.setValueAtTime(.08,now);

        gain.gain.exponentialRampToValueAtTime(

        .001,

        now+.1

        );

        oscillator.start();

        oscillator.stop(now+.1);

    }

    if(type==="wind"){

        oscillator.frequency.value=180;

        gain.gain.setValueAtTime(.05,now);

        gain.gain.exponentialRampToValueAtTime(

        .001,

        now+.5

        );

        oscillator.start();

        oscillator.stop(now+.5);

    }

}

/* ================= TYPEWRITER ================= */

function typeWriter(text,element,callback){

    element.innerHTML="";

    let index=0;

    const timer=setInterval(()=>{

        element.innerHTML+=text[index];

        index++;

        if(index>=text.length){

            clearInterval(timer);

            if(callback){

                callback();

            }

        }

    },18);

}

/* ================= GAME SYSTEM ================= */

const storyElement=

document.getElementById("story");

const choicesElement=

document.getElementById("choices");

const truthElement=

document.getElementById("truth");

let history=[];

function startGame(){

    playSound("click");

    document.getElementById(

    "startScreen"

    ).style.display="none";

    document.getElementById(

    "gameScreen"

    ).style.display="block";

    loadScene("intro");

}

function createChoices(scene){

    choicesElement.innerHTML="";

    scene.choices.forEach(choice=>{

        const button=

        document.createElement("button");

        button.className="choice";

        button.innerText=choice.text;

        button.onclick=()=>{

            playSound("click");

            loadScene(choice.next);

        };

        choicesElement.appendChild(button);

    });

}
