<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WINTER MEMORY — ความทรงจำใต้หิมะ</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500;600&display=swap');

/* =========================================================
   ROOT
========================================================= */

:root{
    --bg:#02060b;
    --bg2:#07131f;

    --panel:rgba(7,16,26,.88);
    --panel2:rgba(12,26,39,.76);

    --text:#edf8ff;
    --muted:#9eb2c0;

    --ice:#ccefff;
    --ice2:#83d2f4;
    --blue:#5b9fc7;

    --line:rgba(190,230,250,.14);

    --gold:#e8d8b0;
    --memory:#b7dff2;

    --shadow:
        0 35px 100px rgba(0,0,0,.65);

    --transition:.8s cubic-bezier(.22,.61,.36,1);
}

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(80,145,180,.14),
            transparent 34%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(55,105,140,.08),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #010409,
            #07111c 55%,
            #02060b
        );

    color:var(--text);

    font-family:'Kanit',sans-serif;

    overflow-x:hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:0;
}

.moon{
    position:absolute;

    width:280px;
    height:280px;

    right:8%;
    top:7%;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff 0%,
            #e5f7ff 22%,
            #b5dbea 58%,
            rgba(115,170,195,.7) 100%
        );

    box-shadow:
        0 0 55px rgba(180,225,255,.16),
        0 0 160px rgba(100,180,220,.08);

    opacity:.58;

    transition:
        transform 2s ease,
        opacity 2s ease;
}

.moon:after{
    content:"";

    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 60% 30%,
            rgba(80,130,155,.15) 0 8%,
            transparent 9%
        ),
        radial-gradient(
            circle at 35% 65%,
            rgba(80,130,155,.12) 0 10%,
            transparent 11%
        ),
        radial-gradient(
            circle at 70% 70%,
            rgba(80,130,155,.12) 0 6%,
            transparent 7%
        );
}

.fog{
    position:absolute;

    width:1000px;
    height:300px;

    left:-300px;
    bottom:5%;

    background:
        radial-gradient(
            ellipse,
            rgba(160,215,235,.08),
            transparent 70%
        );

    filter:blur(25px);

    animation:fogMove 20s ease-in-out infinite alternate;
}

.fog.two{
    left:auto;
    right:-400px;
    bottom:25%;

    animation-delay:-8s;
    animation-duration:26s;
}

@keyframes fogMove{
    from{
        transform:translateX(-60px);
    }

    to{
        transform:translateX(260px);
    }
}

/* =========================================================
   LIGHT PARTICLES
========================================================= */

.light-particles{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:1;

    overflow:hidden;
}

.light-particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#d9f4ff;

    box-shadow:
        0 0 8px rgba(190,235,255,.7);

    opacity:.15;

    animation:
        particleFloat
        linear infinite;
}

@keyframes particleFloat{
    from{
        transform:translateY(105vh);
        opacity:0;
    }

    20%{
        opacity:.2;
    }

    80%{
        opacity:.12;
    }

    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* =========================================================
   SNOW
========================================================= */

.snow{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:20;

    overflow:hidden;
}

.snowflake{
    position:absolute;

    top:-40px;

    color:#fff;

    opacity:.6;

    text-shadow:
        0 0 8px rgba(210,240,255,.9);

    animation:
        snowfall
        linear infinite;
}

@keyframes snowfall{

    0%{
        transform:
            translate3d(0,-40px,0)
            rotate(0deg);
    }

    25%{
        transform:
            translate3d(25px,25vh,0)
            rotate(90deg);
    }

    50%{
        transform:
            translate3d(-20px,50vh,0)
            rotate(180deg);
    }

    75%{
        transform:
            translate3d(30px,75vh,0)
            rotate(270deg);
    }

    100%{
        transform:
            translate3d(-10px,110vh,0)
            rotate(360deg);
    }
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:fixed;

    top:0;
    left:0;
    right:0;

    height:74px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 35px;

    z-index:30;

    background:
        linear-gradient(
            to bottom,
            rgba(2,6,11,.94),
            rgba(2,6,11,.48),
            transparent
        );
}

.logo{
    letter-spacing:7px;

    font-size:14px;

    color:#eaf8ff;

    font-weight:500;
}

.logo span{
    color:#83c8e9;
}

.controls{
    display:flex;
    gap:10px;
}

.control-btn{
    width:42px;
    height:42px;

    border:1px solid rgba(190,230,250,.15);

    border-radius:50%;

    background:rgba(8,18,28,.65);

    color:#d9effa;

    cursor:pointer;

    transition:.3s;

    font-size:16px;
}

.control-btn:hover{
    border-color:rgba(190,230,250,.45);

    background:rgba(30,55,72,.7);

    transform:
        translateY(-2px)
        scale(1.04);
}

/* =========================================================
   GAME
========================================================= */

.game{
    position:relative;

    z-index:5;

    width:min(1050px,calc(100% - 35px));

    min-height:100vh;

    margin:auto;

    padding:125px 0 80px;

    display:flex;

    align-items:center;

    justify-content:center;
}

.scene{
    width:100%;

    position:relative;
}

/* =========================================================
   CHAPTER HEADER
========================================================= */

.chapter{
    text-align:center;

    margin-bottom:30px;

    animation:
        chapterAppear
        1s ease;
}

@keyframes chapterAppear{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.chapter-number{
    font-size:11px;

    letter-spacing:6px;

    color:#7fb7d3;

    margin-bottom:10px;

    text-transform:uppercase;
}

.chapter-title{
    font-family:'Itim',cursive;

    font-size:47px;

    letter-spacing:3px;

    color:#effaff;

    text-shadow:
        0 0 25px rgba(130,210,245,.18),
        0 0 70px rgba(100,180,220,.06);
}

.chapter-line{
    width:90px;
    height:1px;

    margin:18px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(180,230,255,.45),
            transparent
        );
}

/* =========================================================
   STORY BOX
========================================================= */

.story-box{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(9,20,31,.94),
            rgba(4,11,18,.93)
        );

    border:
        1px solid var(--line);

    border-radius:28px;

    box-shadow:var(--shadow);

    overflow:hidden;

    backdrop-filter:blur(14px);
}

.story-box:before{
    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            110deg,
            transparent 0%,
            rgba(180,230,255,.025) 45%,
            transparent 75%
        );

    animation:
        panelLight
        8s ease-in-out infinite;
}

@keyframes panelLight{

    0%,100%{
        transform:translateX(-30%);
    }

    50%{
        transform:translateX(30%);
    }
}

.story-box:after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(180,230,255,.45),
            transparent
        );
}

/* =========================================================
   MEMORY DECOR
========================================================= */

.memory-mark{
    position:absolute;

    right:28px;
    top:24px;

    font-size:10px;

    letter-spacing:3px;

    color:rgba(190,225,240,.28);

    writing-mode:vertical-rl;

    pointer-events:none;
}

/* =========================================================
   STORY CONTENT
========================================================= */

.story-content{
    position:relative;

    padding:65px 85px 45px;
}

.story-text{
    font-size:18px;

    line-height:2.25;

    color:#dce8ee;

    white-space:pre-line;

    min-height:390px;

    text-shadow:
        0 1px 1px rgba(0,0,0,.3);
}

.story-text .special{
    color:#c8edff;
}

.story-text strong{
    color:#f3fbff;

    font-weight:500;
}

/* =========================================================
   MEMORY QUOTE
========================================================= */

.memory-quote{
    margin:
        10px 0
        25px;

    padding:
        22px 25px;

    border-left:
        2px solid
        rgba(130,205,240,.4);

    background:
        linear-gradient(
            90deg,
            rgba(130,200,235,.045),
            transparent
        );

    color:#c7eafb;

    font-family:'Itim',cursive;

    font-size:22px;

    line-height:1.8;

    text-align:left;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-area{
    padding:
        0 85px
        25px;
}

.progress-top{
    display:flex;

    justify-content:space-between;

    color:#718795;

    font-size:10px;

    letter-spacing:2px;

    margin-bottom:9px;
}

.progress{
    width:100%;

    height:2px;

    background:
        rgba(180,220,240,.1);

    overflow:hidden;
}

.progress-bar{
    height:100%;

    width:0;

    background:
        linear-gradient(
            90deg,
            #5c91b2,
            #d8f4ff
        );

    box-shadow:
        0 0 15px
        rgba(130,205,240,.5);

    transition:
        width 1.2s
        cubic-bezier(.22,.61,.36,1);
}

/* =========================================================
   CONTINUE
========================================================= */

.continue-area{
    display:flex;

    justify-content:center;

    padding:
        0 85px
        40px;
}

.read-btn{
    position:relative;

    min-width:220px;

    padding:15px 34px;

    border:
        1px solid
        rgba(180,225,245,.22);

    border-radius:999px;

    background:
        rgba(130,190,220,.055);

    color:#e8f8ff;

    font-family:'Kanit',sans-serif;

    font-size:15px;

    cursor:pointer;

    transition:.35s;

    overflow:hidden;
}

.read-btn:before{
    content:"";

    position:absolute;

    left:-100%;

    top:0;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(210,245,255,.12),
            transparent
        );

    transition:.6s;
}

.read-btn:hover:before{
    left:100%;
}

.read-btn:hover{
    background:
        rgba(130,190,220,.13);

    border-color:
        rgba(190,230,250,.5);

    box-shadow:
        0 0 30px
        rgba(100,190,230,.12);

    transform:translateY(-2px);
}

.read-btn.hidden{
    display:none;
}

/* =========================================================
   CHOICES
========================================================= */

.choices{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;

    padding:
        0 85px
        50px;

    animation:
        choicesAppear
        .7s ease;
}

@keyframes choicesAppear{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.choice{
    position:relative;

    width:100%;

    min-height:95px;

    text-align:left;

    padding:
        18px
        22px;

    border:
        1px solid
        rgba(180,225,245,.13);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(11,25,37,.72),
            rgba(7,17,27,.75)
        );

    color:#dcecf4;

    font-family:'Kanit',sans-serif;

    font-size:15px;

    cursor:pointer;

    transition:.35s;

    overflow:hidden;
}

.choice-number{
    display:block;

    color:#7394a6;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:7px;
}

.choice-title{
    display:block;

    color:#e6f7ff;

    font-size:16px;

    margin-bottom:4px;
}

.choice-description{
    display:block;

    color:#8198a5;

    font-size:11px;

    line-height:1.6;
}

.choice:before{
    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:3px;

    background:transparent;

    transition:.35s;
}

.choice:hover{
    transform:
        translateY(-4px);

    border-color:
        rgba(170,220,245,.35);

    background:
        linear-gradient(
            145deg,
            rgba(25,48,64,.8),
            rgba(11,25,37,.8)
        );

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.25);
}

.choice:hover:before{
    background:#8dd3f2;

    box-shadow:
        0 0 15px
        #8dd3f2;
}

/* =========================================================
   MEMORY FRAGMENT
========================================================= */

.fragment{
    margin:
        0 85px
        35px;

    padding:
        16px 20px;

    border:
        1px solid
        rgba(190,225,240,.08);

    border-radius:12px;

    background:
        rgba(180,220,240,.025);

    color:#78909d;

    font-size:11px;

    letter-spacing:1px;

    line-height:1.8;

    animation:
        fadeIn
        1s ease;
}

.fragment span{
    color:#a9d5e9;
}

/* =========================================================
   START SCREEN
========================================================= */

.start-screen{
    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        radial-gradient(
            circle at center,
            rgba(42,78,101,.2),
            transparent 42%
        ),
        rgba(2,6,11,.97);

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.start-screen.hide{
    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.start-content{
    width:min(
        720px,
        calc(100% - 35px)
    );

    text-align:center;

    animation:
        startAppear
        1.4s ease;
}

@keyframes startAppear{

    from{
        opacity:0;
        transform:
            translateY(25px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

.start-small{
    font-size:11px;

    letter-spacing:8px;

    color:#83b7cf;

    margin-bottom:22px;
}

.start-title{
    font-family:'Itim',cursive;

    font-size:82px;

    letter-spacing:10px;

    color:#eefaff;

    text-shadow:
        0 0 25px rgba(170,225,250,.13),
        0 0 80px rgba(100,180,220,.08);
}

.start-sub{
    color:#91a7b4;

    margin:
        15px 0
        50px;

    font-size:15px;

    line-height:2;

    letter-spacing:1px;
}

.start-btn{
    padding:
        15px
        58px;

    border-radius:999px;

    border:
        1px solid
        rgba(190,230,250,.28);

    background:
        rgba(120,185,215,.08);

    color:#eaf8ff;

    font-family:'Kanit',sans-serif;

    font-size:16px;

    cursor:pointer;

    transition:.35s;
}

.start-btn:hover{
    background:
        rgba(130,200,235,.16);

    border-color:
        rgba(210,240,255,.6);

    box-shadow:
        0 0 40px
        rgba(100,190,230,.14);

    transform:
        translateY(-3px);
}

.start-line{
    width:90px;

    height:1px;

    margin:
        40px
        auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #a9dff5,
            transparent
        );
}

/* =========================================================
   CINEMATIC TRANSITION
========================================================= */

.scene-transition{
    position:fixed;

    inset:0;

    background:
        radial-gradient(
            circle,
            rgba(190,230,250,.1),
            rgba(2,6,11,.96)
        );

    z-index:90;

    pointer-events:none;

    opacity:0;

    visibility:hidden;

    transition:
        opacity .6s ease,
        visibility .6s ease;
}

.scene-transition.active{
    opacity:1;
    visibility:visible;
}

/* =========================================================
   END SCREEN
========================================================= */

.end-screen{
    text-align:center;

    padding:
        65px
        30px
        75px;

    animation:
        endAppear
        1.4s ease;
}

@keyframes endAppear{

    from{
        opacity:0;
        transform:
            translateY(25px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

.end-icon{
    font-size:48px;

    margin-bottom:15px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(200,235,255,.2)
        );
}

.end-label{
    color:#789aaa;

    font-size:10px;

    letter-spacing:5px;

    margin-bottom:12px;
}

.end-title{
    font-family:'Itim',cursive;

    font-size:48px;

    letter-spacing:4px;

    margin-bottom:28px;

    color:#edfaff;

    text-shadow:
        0 0 25px
        rgba(130,210,245,.15);
}

.end-text{
    max-width:680px;

    margin:auto;

    white-space:pre-line;

    line-height:2.25;

    color:#c7d9e2;

    font-size:17px;
}

.end-divider{
    width:100px;

    height:1px;

    margin:
        35px
        auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(190,225,240,.4),
            transparent
        );
}

.end-memory{
    font-family:'Itim',cursive;

    color:#b6dced;

    font-size:21px;

    line-height:1.8;
}

.end-actions{
    margin-top:40px;

    display:flex;

    gap:12px;

    justify-content:center;

    flex-wrap:wrap;
}

.end-btn{
    padding:
        12px
        28px;

    border-radius:999px;

    border:
        1px solid
        rgba(190,230,250,.18);

    background:
        rgba(130,190,220,.06);

    color:#e8f8ff;

    font-family:'Kanit',sans-serif;

    cursor:pointer;

    transition:.3s;
}

.end-btn:hover{
    background:
        rgba(130,190,220,.13);

    transform:
        translateY(-2px);
}

/* =========================================================
   TYPE CURSOR
========================================================= */

.cursor{
    display:inline-block;

    width:2px;

    height:1em;

    background:#bfeaff;

    margin-left:4px;

    vertical-align:-2px;

    animation:
        blink
        .7s
        infinite;
}

@keyframes blink{

    50%{
        opacity:0;
    }
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:760px){

    .topbar{
        padding:0 18px;
        height:60px;
    }

    .logo{
        font-size:10px;
        letter-spacing:3px;
    }

    .control-btn{
        width:37px;
        height:37px;
    }

    .game{
        width:calc(100% - 18px);
        padding-top:85px;
    }

    .chapter-title{
        font-size:36px;
    }

    .story-content{
        padding:
            40px
            25px
            30px;
    }

    .story-text{
        font-size:16px;
        line-height:2.05;
        min-height:400px;
    }

    .progress-area{
        padding:
            0 25px
            20px;
    }

    .continue-area{
        padding:
            0 25px
            30px;
    }

    .choices{
        grid-template-columns:1fr;

        padding:
            0 25px
            30px;
    }

    .fragment{
        margin:
            0 25px
            25px;
    }

    .choice{
        min-height:85px;
    }

    .moon{
        width:150px;
        height:150px;

        right:-30px;
        top:100px;

        opacity:.3;
    }

    .start-title{
        font-size:48px;
        letter-spacing:5px;
    }

    .start-small{
        letter-spacing:4px;
    }

    .end-title{
        font-size:37px;
    }

    .end-screen{
        padding:
            45px
            20px
            55px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     BACKGROUND
========================================================= -->

<div class="background">

    <div class="moon"></div>

    <div class="fog"></div>

    <div class="fog two"></div>

</div>

<div class="light-particles" id="lightParticles"></div>

<div class="snow" id="snow"></div>

<div class="scene-transition" id="sceneTransition"></div>


<!-- =========================================================
     TOP BAR
========================================================= -->

<header class="topbar">

    <div class="logo">
        WINTER <span>MEMORY</span>
    </div>

    <div class="controls">

        <button
            class="control-btn"
            id="soundBtn"
            title="เปิด / ปิดเสียง"

let audioEnabled = true;
let audioContext = null;

function initAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }

}

function playTone(
    frequency = 500,
    duration = .05,
    type = "sine",
    volume = .02
){

    if(!audioEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}

    document.getElementById(
        "sceneTransition"

/* =========================================================
   TYPEWRITER
========================================================= */

function typeText(
    text,
    callback
){

    clearTimeout(typeTimer);

    isTyping =
        true;

    skipTyping =
        false;

    storyText.innerHTML =
        "";

    const cursor =
        document.createElement(
            "span"
        );

    cursor.className =
        "cursor";

    storyText.appendChild(
        cursor
    );

    let index =
        0;

    function type(){

        if(skipTyping){

            storyText.textContent =
                text;

            isTyping =
                false;

            if(callback){
                callback();
            }

            return;
        }

        if(index < text.length){

            const char =
                text.charAt(index);

            cursor.before(
                document.createTextNode(
                    char
                )
            );

            index++;

            if(
                char.trim() !== ""
            ){
                typeSound();
            }

            let speed =
                18;

            if(
                char === "。" ||
                char === "!" ||
                char === "?"
            ){

                speed =
                    180;

            }

            if(
                char === "\n"
            ){

                speed =
                    75;

            }

            typeTimer =
                setTimeout(
                    type,
                    speed
                );

        }else{

            cursor.remove();

            isTyping =
                false;

            if(callback){
                callback();
            }

        }

    }

    type();

}


/* =========================================================
   SHOW SCENE
========================================================= */

function showScene(
    sceneId
){

    const scene =
        STORY[sceneId];

    if(!scene) return;

    currentScene =
        sceneId;

    localStorage.setItem(
        "winterMemoryScene",
        sceneId
    );

    /* cinematic transition */

    sceneTransition.classList.add(
        "active"
    );

    setTimeout(()=>{

        chapterNumber.textContent =
            scene.chapter;

        chapterTitle.textContent =
            scene.title;

        fragment.innerHTML =
            scene.fragment ||
            "ความทรงจำกำลังเปิดออก...";

        progressBar.style.width =
            scene.progress + "%";

        progressText.textContent =
            scene.progress + "%";

        choicesContainer.innerHTML =
            "";

        continueBtn.classList.add(
            "hidden"
        );

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

        sceneTransition.classList.remove(
            "active"
        );

        memorySound();

        typeText(
            scene.text,
            ()=>{

                if(scene.ending){

                    showEnding(
                        scene
                    );

                }else{

                    continueBtn.classList.remove(
                        "hidden"
                    );

                }

            }
        );

    },500);

}


/* =========================================================
   CONTINUE
========================================================= */

continueBtn.addEventListener(
    "click",
    ()=>{

        clickSound();

        if(isTyping){

            skipTyping =
                true;

            return;

        }

        const scene =
            STORY[currentScene];

        if(scene){

            showChoices(
                scene
            );

        }

    }
);


/* =========================================================
   SHOW CHOICES
========================================================= */

function showChoices(
    scene
){

    continueBtn.classList.add(
        "hidden"
    );

    choicesContainer.innerHTML =
        "";

    scene.choices.forEach(
        (choice,index)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "choice";

            button.style.animation =
                `fadeIn .55s ease ${index*.12}s both`;

            button.innerHTML = `

                <span class="choice-number">
                    CHOICE ${String(index+1).padStart(2,"0")}
                </span>

                <span class="choice-title">
                    ${choice.title}
                </span>

                <span class="choice-description">
                    ${choice.description}
                </span>

            `;

            button.addEventListener(
                "click",
                ()=>{

                    choiceSound();

                    showScene(
                        choice.next
                    );

                }
            );

            choicesContainer.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   ENDING
========================================================= */

function showEnding(
    scene
){

    choicesContainer.innerHTML =
        "";

    const end =
        document.createElement(
            "div"
        );

    end.className =
        "end-screen";

    end.innerHTML = `

        <div class="end-icon">
            ${scene.icon || "❄️"}
        </div>

        <div class="end-label">
            FINAL MEMORY
        </div>

        <div class="end-title">
            ${scene.title}
        </div>

        <div class="end-text">
            ${scene.text}
        </div>

        <div class="end-divider"></div>

        <div class="end-memory">
            ${scene.memory}
        </div>

        <div class="end-actions">

            <button
                class="end-btn"
                id="endingRestart"
            >
                ↻ เล่นเรื่องใหม่
            </button>

            <button
                class="end-btn"
                id="endingTop"
            >
                ↑ กลับด้านบน
            </button>

        </div>

    `;

    choicesContainer.appendChild(
        end
    );

    document
        .getElementById(
            "endingRestart"
        )
        .onclick = ()=>{

            clickSound();

            restartGame();

        };

    document
        .getElementById(
            "endingTop"
        )
        .onclick = ()=>{

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

}

        "winterMemoryScene"

    continueBtn.classList.add(

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    (event)=>{

        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();

            if(isTyping){

                skipTyping =
                    true;

            }else if(
                !continueBtn.classList.contains(
                    "hidden"
                )
            ){

                continueBtn.click();

            }

        }

    }
);
