<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WINTER MEMORY — ความทรงจำใต้หิมะ</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500;600&display=swap');

:root{
    --bg:#02060b;
    --bg2:#07121d;
    --panel:rgba(8,18,29,.90);
    --panel-soft:rgba(12,27,40,.72);

    --text:#edf8ff;
    --text-soft:#d2e0e8;
    --muted:#8196a5;

    --ice:#d8f4ff;
    --ice2:#91d8f5;
    --blue:#5da9d6;

    --line:rgba(190,230,250,.15);
    --line-bright:rgba(190,230,250,.30);

    --shadow:
        0 35px 100px rgba(0,0,0,.65),
        0 0 100px rgba(80,160,200,.04);

    --ease:cubic-bezier(.22,.61,.36,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--text);

    font-family:'Kanit',sans-serif;

    background:
        radial-gradient(
            circle at 50% 12%,
            rgba(91,150,185,.14),
            transparent 34%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(58,110,145,.08),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #010409,
            #07121d 55%,
            #010409
        );

    overflow-x:hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.sky-glow{
    position:absolute;
    width:700px;
    height:700px;

    left:50%;
    top:-280px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(160,220,245,.10),
            rgba(90,150,190,.04) 40%,
            transparent 70%
        );

    filter:blur(15px);
}

.moon{
    position:absolute;

    width:280px;
    height:280px;

    right:9%;
    top:8%;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 34% 28%,
            #ffffff 0%,
            #e7f7ff 23%,
            #b9d9e8 55%,
            #7eaabd 100%
        );

    opacity:.55;

    box-shadow:
        0 0 45px rgba(200,235,255,.16),
        0 0 130px rgba(100,190,225,.10);

    animation:
        moonPulse 7s ease-in-out infinite;
}

.moon:before,
.moon:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(70,115,135,.10);
}

.moon:before{
    width:48px;
    height:48px;
    left:35px;
    top:90px;
}

.moon:after{
    width:70px;
    height:70px;
    right:40px;
    bottom:40px;
}

@keyframes moonPulse{
    0%,100%{
        transform:scale(1);
        opacity:.48;
    }

    50%{
        transform:scale(1.025);
        opacity:.58;
    }
}

.fog{
    position:absolute;

    width:1000px;
    height:300px;

    left:-250px;
    bottom:5%;

    background:
        radial-gradient(
            ellipse,
            rgba(160,215,235,.07),
            transparent 70%
        );

    filter:blur(28px);

    animation:
        fogMove 22s ease-in-out infinite alternate;
}

.fog.two{
    left:auto;
    right:-350px;
    bottom:22%;
    animation-duration:30s;
    opacity:.6;
}

@keyframes fogMove{
    from{
        transform:translateX(-50px);
    }

    to{
        transform:translateX(260px);
    }
}

/* =========================================================
   SNOW
========================================================= */

.snow{
    position:fixed;
    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:15;
}

.snowflake{
    position:absolute;

    top:-40px;

    color:#fff;

    text-shadow:
        0 0 7px rgba(210,240,255,.8),
        0 0 16px rgba(160,220,255,.3);

    animation:
        snowfall linear infinite;
}

@keyframes snowfall{

    0%{
        transform:
            translate3d(0,-40px,0)
            rotate(0deg);
    }

    25%{
        transform:
            translate3d(35px,25vh,0)
            rotate(90deg);
    }

    50%{
        transform:
            translate3d(-30px,50vh,0)
            rotate(180deg);
    }

    75%{
        transform:
            translate3d(25px,75vh,0)
            rotate(270deg);
    }

    100%{
        transform:
            translate3d(-20px,110vh,0)
            rotate(360deg);
    }
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:fixed;

    left:0;
    right:0;
    top:0;

    height:78px;

    padding:0 38px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:30;

    background:
        linear-gradient(
            to bottom,
            rgba(2,6,11,.95),
            rgba(2,6,11,.65),
            transparent
        );

    backdrop-filter:blur(5px);
}

.logo{
    font-size:13px;
    letter-spacing:7px;
    color:#eefaff;
}

.logo span{
    color:#8ecce9;
}

.controls{
    display:flex;
    gap:10px;
}

.control-btn{
    width:42px;
    height:42px;

    border-radius:50%;

    border:1px solid rgba(190,230,250,.14);

    background:rgba(8,18,28,.68);

    color:#dff5ff;

    cursor:pointer;

    font-size:16px;

    transition:
        transform .3s var(--ease),
        background .3s,
        border-color .3s,
        box-shadow .3s;
}

.control-btn:hover{
    transform:translateY(-2px);

    background:rgba(25,50,66,.8);

    border-color:rgba(190,230,250,.40);

    box-shadow:
        0 8px 25px rgba(0,0,0,.3),
        0 0 20px rgba(120,205,240,.08);
}

/* =========================================================
   MAIN
========================================================= */

.game{
    position:relative;

    z-index:2;

    width:min(1050px,calc(100% - 32px));

    min-height:100vh;

    margin:auto;

    padding:
        125px 0
        90px;
}

.scene{
    width:100%;
}

/* =========================================================
   CHAPTER HEADER
========================================================= */

.chapter{
    text-align:center;

    margin-bottom:30px;

    animation:
        chapterIn .8s var(--ease);
}

.chapter-number{
    color:#82b9d2;

    font-size:11px;

    letter-spacing:6px;

    margin-bottom:10px;
}

.chapter-title{
    font-family:'Itim',cursive;

    font-size:46px;

    letter-spacing:3px;

    color:#effaff;

    text-shadow:
        0 0 25px rgba(140,215,245,.16);
}

.chapter-subtitle{
    margin-top:8px;

    color:#718695;

    font-size:12px;

    letter-spacing:2px;
}

@keyframes chapterIn{
    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   STORY BOX
========================================================= */

.story-box{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(10,22,34,.95),
            rgba(4,12,20,.94)
        );

    border:1px solid var(--line);

    border-radius:28px;

    box-shadow:var(--shadow);

    overflow:hidden;

    animation:
        boxIn .9s var(--ease);
}

@keyframes boxIn{
    from{
        opacity:0;
        transform:
            translateY(18px)
            scale(.985);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.story-box:before{
    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(180,230,255,.025),
            transparent
        );
}

.story-box:after{
    content:"";

    position:absolute;

    top:0;
    left:10%;
    right:10%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(190,230,250,.38),
            transparent
        );
}

/* =========================================================
   NOVEL PAGE
========================================================= */

.story-content{
    padding:
        62px
        85px
        48px;
}

.story-label{
    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:28px;

    color:#6f8998;

    font-size:10px;

    letter-spacing:4px;
}

.story-label:before,
.story-label:after{
    content:"";

    height:1px;

    flex:1;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(170,215,235,.16)
        );
}

.story-label:after{
    background:
        linear-gradient(
            90deg,
            rgba(170,215,235,.16),
            transparent
        );
}

.story-text{
    color:#dce8ee;

    font-size:18px;

    line-height:2.15;

    font-weight:300;

    text-align:left;

    letter-spacing:.15px;
}

/*
    IMPORTANT:
    เนื้อเรื่องจะถูกแบ่งเป็น "ย่อหน้า"
    ไม่ใช่ขึ้นบรรทัดใหม่ทุกประโยค
*/

.story-paragraph{
    margin-bottom:25px;

    opacity:0;

    animation:
        paragraphIn .65s ease forwards;
}

.story-paragraph:last-child{
    margin-bottom:0;
}

.story-paragraph.first-letter::first-letter{
    font-family:'Itim',cursive;

    font-size:55px;

    float:left;

    line-height:.78;

    padding:
        8px
        8px
        0
        0;

    color:#c8edff;

    text-shadow:
        0 0 18px rgba(130,210,245,.18);
}

@keyframes paragraphIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   DIALOGUE
========================================================= */

.dialogue{
    margin:32px 0;

    padding:
        22px
        30px;

    border-left:2px solid rgba(130,205,240,.38);

    background:
        linear-gradient(
            90deg,
            rgba(100,170,205,.065),
            transparent
        );

    color:#c9edff;

    font-family:'Itim',cursive;

    font-size:22px;

    line-height:1.8;

    text-shadow:
        0 0 15px rgba(100,190,230,.08);
}

.dialogue.center{
    text-align:center;

    border-left:0;

    border-top:1px solid rgba(150,210,235,.13);
    border-bottom:1px solid rgba(150,210,235,.13);

    padding:
        28px
        15px;
}

/* =========================================================
   MEMORY QUOTE
========================================================= */

.memory{
    margin:35px 0;

    padding:30px;

    text-align:center;

    border-top:1px solid rgba(180,225,245,.10);
    border-bottom:1px solid rgba(180,225,245,.10);

    color:#9fc8db;

    font-family:'Itim',cursive;

    font-size:21px;

    line-height:1.8;
}

/* =========================================================
   TYPEWRITER
========================================================= */

.cursor{
    display:inline-block;

    width:2px;
    height:1.05em;

    background:#c5eeff;

    margin-left:3px;

    vertical-align:-2px;

    animation:
        blink .7s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-area{
    padding:
        0
        85px
        25px;
}

.progress-top{
    display:flex;

    justify-content:space-between;

    margin-bottom:9px;

    color:#657b89;

    font-size:10px;

    letter-spacing:3px;
}

.progress{
    width:100%;

    height:2px;

    background:
        rgba(180,220,240,.08);

    overflow:hidden;
}

.progress-bar{
    height:100%;

    width:0;

    background:
        linear-gradient(
            90deg,
            #527f9b,
            #d8f4ff
        );

    box-shadow:
        0 0 14px rgba(130,205,240,.4);

    transition:
        width 1s var(--ease);
}

/* =========================================================
   CONTINUE
========================================================= */

.continue-area{
    display:flex;

    justify-content:center;

    padding:
        8px
        85px
        42px;
}

.read-btn{
    min-width:230px;

    padding:
        14px
        32px;

    border-radius:999px;

    border:1px solid rgba(180,225,245,.23);

    background:
        rgba(120,190,220,.055);

    color:#e8f8ff;

    font-family:'Kanit',sans-serif;

    font-size:15px;

    cursor:pointer;

    transition:
        .3s var(--ease);
}

.read-btn:hover{
    background:
        rgba(130,200,235,.12);

    border-color:
        rgba(210,240,255,.48);

    box-shadow:
        0 0 30px rgba(100,190,230,.10);

    transform:
        translateY(-2px);
}

.read-btn.hidden{
    display:none;
}

/* =========================================================
   CHOICES
========================================================= */

.choices{
    display:grid;

    grid-template-columns:1fr;

    gap:12px;

    padding:
        0
        85px
        50px;
}

.choice-intro{
    text-align:center;

    color:#718695;

    font-size:12px;

    letter-spacing:2px;

    margin-bottom:4px;
}

.choice{
    position:relative;

    width:100%;

    text-align:left;

    padding:
        20px
        25px;

    border:
        1px solid rgba(180,225,245,.12);

    border-radius:15px;

    background:
        rgba(10,25,38,.65);

    color:#dcecf4;

    font-family:'Kanit',sans-serif;

    font-size:16px;

    cursor:pointer;

    overflow:hidden;

    transition:
        .35s var(--ease);
}

.choice:before{
    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:3px;

    background:transparent;

    transition:.3s;
}

.choice:hover{
    transform:
        translateX(7px);

    border-color:
        rgba(170,220,245,.32);

    background:
        rgba(25,48,64,.72);

    box-shadow:
        0 12px 30px rgba(0,0,0,.18);
}

.choice:hover:before{
    background:#8dd3f2;

    box-shadow:
        0 0 15px #8dd3f2;
}

/* =========================================================
   ENDING
========================================================= */

.ending{
    padding:
        70px
        85px
        80px;

    text-align:center;
}

.ending-icon{
    font-size:50px;

    margin-bottom:18px;

    filter:
        drop-shadow(
            0 0 15px rgba(190,230,250,.18)
        );

    animation:
        endingPulse 4s ease-in-out infinite;
}

@keyframes endingPulse{
    0%,100%{
        transform:scale(1);
        opacity:.8;
    }

    50%{
        transform:scale(1.06);
        opacity:1;
    }
}

.ending-title{
    font-family:'Itim',cursive;

    font-size:48px;

    letter-spacing:4px;

    color:#effaff;

    margin-bottom:30px;
}

.ending-divider{
    width:90px;

    height:1px;

    margin:0 auto 30px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #bfeaff,
            transparent
        );
}

.ending-text{
    max-width:730px;

    margin:auto;

    color:#d0dfe7;

    font-size:18px;

    line-height:2.15;

    font-weight:300;

    text-align:left;
}

.ending-text p{
    margin-bottom:25px;
}

.the-end{
    margin-top:50px;

    color:#aacfe0;

    font-family:'Itim',cursive;

    font-size:28px;

    letter-spacing:8px;
}

.ending-actions{
    margin-top:40px;

    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;
}

.end-btn{
    padding:
        12px
        28px;

    border-radius:999px;

    border:1px solid rgba(190,230,250,.18);

    background:
        rgba(130,190,220,.05);

    color:#e8f8ff;

    font-family:'Kanit',sans-serif;

    cursor:pointer;

    transition:.3s;
}

.end-btn:hover{
    background:
        rgba(130,190,220,.13);

    transform:
        translateY(-2px);
}

/* =========================================================
   START SCREEN
========================================================= */

.start-screen{
    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            rgba(50,95,120,.17),
            transparent 40%
        ),
        rgba(1,5,9,.97);

    transition:
        opacity 1s var(--ease),
        visibility 1s;
}

.start-screen.hide{
    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.start-content{
    width:min(720px,calc(100% - 35px));

    text-align:center;
}

.start-small{
    color:#82b6ce;

    font-size:11px;

    letter-spacing:7px;

    margin-bottom:20px;
}

.start-title{
    font-family:'Itim',cursive;

    font-size:82px;

    letter-spacing:10px;

    color:#f0fbff;

    text-shadow:
        0 0 25px rgba(170,225,250,.13),
        0 0 80px rgba(100,180,220,.08);

    animation:
        titleFloat 5s ease-in-out infinite;
}

@keyframes titleFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}

.start-sub{
    max-width:580px;

    margin:
        18px auto
        48px;

    color:#91a8b6;

    font-size:15px;

    line-height:2;

    letter-spacing:1px;
}

.start-btn{
    padding:
        15px
        58px;

    border-radius:999px;

    border:1px solid rgba(190,230,250,.28);

    background:
        rgba(120,185,215,.07);

    color:#eaf8ff;

    font-family:'Kanit',sans-serif;

    font-size:16px;

    cursor:pointer;

    transition:.35s;
}

.start-btn:hover{
    background:
        rgba(130,200,235,.15);

    border-color:
        rgba(210,240,255,.58);

    box-shadow:
        0 0 40px rgba(100,190,230,.13);

    transform:
        translateY(-3px);
}

.start-line{
    width:90px;

    height:1px;

    margin:38px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #a9dff5,
            transparent
        );
}

/* =========================================================
   TRANSITION
========================================================= */

.scene-transition{
    position:fixed;

    inset:0;

    z-index:80;

    pointer-events:none;

    background:#02070c;

    opacity:0;

    transition:
        opacity .45s ease;
}

.scene-transition.active{
    opacity:1;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .topbar{
        height:62px;

        padding:
            0
            17px;
    }

    .logo{
        font-size:10px;
        letter-spacing:4px;
    }

    .control-btn{
        width:37px;
        height:37px;
    }

    .game{
        width:
            calc(100% - 14px);

        padding:
            90px 0
            50px;
    }

    .chapter{
        margin-bottom:20px;
    }

    .chapter-number{
        font-size:9px;
        letter-spacing:4px;
    }

    .chapter-title{
        font-size:34px;
    }

    .chapter-subtitle{
        font-size:10px;
    }

    .story-box{
        border-radius:20px;
    }

    .story-content{
        padding:
            38px
            25px
            32px;
    }

    .story-label{
        margin-bottom:22px;
    }

    .story-text{
        font-size:16px;
        line-height:2;
    }

    .story-paragraph{
        margin-bottom:22px;
    }

    .story-paragraph.first-letter::first-letter{
        font-size:45px;
    }

    .dialogue{
        font-size:19px;

        padding:
            18px
            20px;

        margin:
            26px 0;
    }

    .memory{
        font-size:19px;
        padding:24px 10px;
    }

    .progress-area{
        padding:
            0
            25px
            22px;
    }

    .continue-area{
        padding:
            7px
            25px
            32px;
    }

    .choices{
        padding:
            0
            25px
            35px;
    }

    .choice{
        font-size:14px;
        padding:17px 18px;
    }

    .moon{
        width:150px;
        height:150px;
        right:-35px;
        top:90px;
        opacity:.28;
    }

    .start-title{
        font-size:48px;
        letter-spacing:5px;
    }

    .start-small{
        letter-spacing:4px;
    }

    .start-sub{
        font-size:13px;
    }

    .ending{
        padding:
            45px
            25px
            55px;
    }

    .ending-title{
        font-size:36px;
    }

    .ending-text{
        font-size:16px;
        line-height:2;
    }

    .the-end{
        font-size:22px;
        letter-spacing:5px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     BACKGROUND
========================================================= -->

<div class="background">

    <div class="sky-glow"></div>

    <div class="moon"></div>

    <div class="fog"></div>

    <div class="fog two"></div>

</div>

<div class="snow" id="snow"></div>

<div class="scene-transition" id="sceneTransition"></div>

<!-- =========================================================
     TOP BAR
========================================================= -->

<header class="topbar">

    <div class="logo">
        WINTER <span>MEMORY</span>
    </div>

    <div class="controls">

        <button
            class="control-btn"
            id="soundBtn"
            title="เปิด / ปิดเสียง"
        >
            🔊
        </button>

        <button
            class="control-btn"
            id="restartBtn"

let audioEnabled = true;
let audioContext = null;

function initAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

}

function playTone(
    frequency=500,
    duration=.05,
    type="sine",
    volume=.025
){

    if(!audioEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );

}

const storyText =
    document.getElementById("storyText");

    document.getElementById("chapterNumber");

    document.getElementById("chapterTitle");

    document.getElementById("chapterSubtitle");

    document.getElementById("choices");

    document.getElementById("continueBtn");

    document.getElementById("progressBar");

    document.getElementById("progressText");

    document.getElementById("startScreen");

    document.getElementById("sceneTransition");

/* =========================================================
   GAME STATE
========================================================= */

let isTyping = false;

let skipTyping = false;

let typeTimer = null;

let currentSceneData = null;

/* =========================================================
   PARSE NOVEL
========================================================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

function createNovelHTML(scene){

    let html = "";

    const keys = [
        "text",
        "afterDialogue",
        "afterDialogue2",
        "afterDialogue3",
        "afterDialogue4",
        "afterDialogue5"
    ];

    keys.forEach((key)=>{

        if(scene[key]){

            html +=
                `<p class="story-paragraph ${
                    html === "" ? "first-letter" : ""
                }">${escapeHTML(scene[key].trim())}</p>`;

        }

    });

    /*
       บทพูดจะถูกแทรกตามลำดับที่ข้อมูลกำหนด
    */

    const special =
        [];

    Object.keys(scene).forEach(key=>{

        if(
            key.startsWith("dialogue")
        ){

            const value =
                scene[key];

            const match =
                key.match(/dialogue(\d*)/);

            const number =
                match && match[1]
                    ? parseInt(match[1])
                    : 0;

            special.push({
                number,
                value
            });

        }

    });

    /*
       เนื่องจากต้องรักษาลำดับของนิยาย
       เราจะใช้ตัวสร้างใหม่ด้านล่าง
    */

    html = buildOrderedContent(scene);

    return html;

}

function buildOrderedContent(scene){

    let html = "";

    const addParagraph =
        (text,first=false)=>{

            if(!text) return;

            html +=
                `<p class="story-paragraph ${
                    first ? "first-letter" : ""
                }">${escapeHTML(text.trim())}</p>`;

        };

    const addDialogue =
        (text)=>{

            if(!text) return;

            html +=
                `<div class="dialogue">${escapeHTML(text.trim())}</div>`;

        };

    const addMemory =
        (text)=>{

            if(!text) return;

            html +=
                `<div class="memory">${text.trim()}</div>`;

        };

    /*
       ฉากทั้งหมดถูกออกแบบให้เรียงตาม:
       text -> dialogue -> afterDialogue -> dialogue2...
    */

    addParagraph(scene.text,true);

    addDialogue(scene.dialogue);

    addParagraph(scene.afterDialogue);

    addMemory(scene.memory);

    addParagraph(scene.afterMemory);

    addDialogue(scene.dialogue2);

    addParagraph(scene.afterDialogue2);

    addDialogue(scene.dialogue3);

    addParagraph(scene.afterDialogue3);

    addDialogue(scene.dialogue4);

    addParagraph(scene.afterDialogue4);

    addDialogue(scene.dialogue5);

    addParagraph(scene.afterDialogue5);

    return html;

}

/* =========================================================
   TYPEWRITER NOVEL
========================================================= */

function typeNovel(scene,callback){

    clearTimeout(typeTimer);

    isTyping = true;

    skipTyping = false;

    storyText.innerHTML = "";

    /*
       สร้างเนื้อหา HTML ก่อน
       แต่จะค่อย ๆ แสดงตัวอักษรทีละตัว
    */

    const source =
        buildOrderedContent(scene);

    /*
       ถ้ากดอ่านต่อระหว่างพิมพ์
       จะแสดงเนื้อหาทั้งหมดทันที
    */

    let index = 0;

    const wrapper =
        document.createElement("div");

    wrapper.innerHTML =
        source;

    const fullText =
        wrapper.innerHTML;

    /*
       สำหรับการแสดงผลที่ไม่ทำ HTML พัง
       เราจะใช้ innerHTML เป็นช่วง ๆ
       โดยแบ่งตามย่อหน้า
    */

    const blocks =
        [...wrapper.children];

    storyText.innerHTML = "";

    let blockIndex = 0;

    function typeBlock(){

        if(skipTyping){

            storyText.innerHTML =
                source;

            isTyping = false;

            if(callback){
                callback();
            }

            return;

        }

        if(blockIndex >= blocks.length){

            isTyping = false;

            if(callback){
                callback();
            }

            return;

        }

        const block =
            blocks[blockIndex];

        const fullHTML =
            block.innerHTML;

        /*
           block เป็นข้อความธรรมดาเกือบทั้งหมด
           memory มี <br> ได้
        */

        const target =
            document.createElement(
                "div"
            );

        target.className =
            block.className;

        storyText.appendChild(
            target
        );

        let text =
            block.textContent;

        let charIndex = 0;

        function char(){

            if(skipTyping){

                storyText.innerHTML =
                    source;

                isTyping = false;

                if(callback){
                    callback();
                }

                return;

            }

            if(charIndex < text.length){

                target.textContent =
                    text.substring(
                        0,
                        charIndex + 1
                    );

                charIndex++;

                if(
                    text[charIndex-1].trim() !== ""
                ){
                    typeSound();
                }

                let speed = 9;

                if(
                    text[charIndex-1] === " " 
                ){
                    speed = 5;
                }

                if(
                    text[charIndex-1] === "。" ||
                    text[charIndex-1] === "!" ||
                    text[charIndex-1] === "?"
                ){
                    speed = 110;
                }

                typeTimer =
                    setTimeout(
                        char,
                        speed
                    );

            }else{

                /*
                   คืน HTML ของ dialogue / memory
                   เพื่อให้ <br> กลับมา
                */

                if(
                    block.classList.contains("dialogue") ||
                    block.classList.contains("memory")
                ){
                    target.innerHTML =
                        fullHTML;
                }

                blockIndex++;

                setTimeout(
                    typeBlock,
                    80
                );

            }

        }

        char();

    }

    typeBlock();

}

/* =========================================================
   SHOW SCENE
========================================================= */

function showScene(sceneId){

    const scene =
        STORY[sceneId];

    if(!scene) return;

    currentScene =
        sceneId;

    currentSceneData =
        scene;

    localStorage.setItem(
        "winterMemoryScene",
        sceneId
    );

    transition.classList.add(
        "active"
    );

    setTimeout(()=>{

        chapterNumber.textContent =
            scene.chapter;

        chapterTitle.textContent =
            scene.title;

        chapterSubtitle.textContent =
            scene.subtitle || "";

        progressBar.style.width =
            scene.progress + "%";

        progressText.textContent =
            scene.progress + "%";

        choices.innerHTML = "";

        continueBtn.classList.add(
            "hidden"
        );

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

        setTimeout(()=>{

            transition.classList.remove(
                "active"
            );

            typeNovel(
                scene,
                ()=>{

                    if(scene.ending){

                        showEnding(scene);

                    }else{

                        continueBtn.classList.remove(
                            "hidden"
                        );

                    }

                }
            );

        },300);

    },300);

}

/* =========================================================
   CONTINUE
========================================================= */

continueBtn.addEventListener(
    "click",
    ()=>{

        clickSound();

        if(isTyping){

            skipTyping = true;

            return;

        }

        showChoices(
            currentSceneData
        );

    }
);

/* =========================================================
   CHOICES
========================================================= */

function showChoices(scene){

    continueBtn.classList.add(
        "hidden"
    );

    choices.innerHTML = "";

    if(
        !scene.choices ||
        scene.choices.length === 0
    ){
        return;
    }

    const intro =
        document.createElement("div");

    intro.className =
        "choice-intro";

    intro.textContent =
        "คุณจะเลือกทำอย่างไรต่อไป";

    choices.appendChild(
        intro
    );

    scene.choices.forEach(
        (choice,index)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "choice";

            button.textContent =
                choice.text;

            button.style.animation =
                `paragraphIn .6s ease ${
                    index*.12
                }s both`;

            button.addEventListener(
                "click",
                ()=>{

                    choiceSound();

                    showScene(
                        choice.next
                    );

                }
            );

            choices.appendChild(
                button
            );

        }
    );

}

/* =========================================================
   ENDING
========================================================= */

function showEnding(scene){

    choices.innerHTML = "";

    endingSound();

    const ending =
        document.createElement(
            "div"
        );

    ending.className =
        "ending";

    const icon =
        document.createElement(
            "div"
        );

    icon.className =
        "ending-icon";

    icon.textContent =
        scene.icon || "❄️";

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "ending-title";

    title.textContent =
        scene.title;

    const divider =
        document.createElement(
            "div"
        );

    divider.className =
        "ending-divider";

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "ending-text";

    /*
       Ending ก็อ่านแบบนิยาย
    */

    const source =
        buildOrderedContent(scene);

    const temp =
        document.createElement(
            "div"
        );

    temp.innerHTML =
        source;

    [...temp.children].forEach(
        child=>{

            if(
                child.classList.contains(
                    "dialogue"
                ) ||
                child.classList.contains(
                    "memory"
                )
            ){

                const p =
                    document.createElement(
                        "p"
                    );

                p.innerHTML =
                    child.innerHTML;

                p.style.textAlign =
                    "center";

                p.style.fontFamily =
                    "'Itim',cursive";

                p.style.color =
                    "#bfe8f8";

                p.style.fontSize =
                    "21px";

                p.style.margin =
                    "28px 0";

                text.appendChild(
                    p
                );

            }else{

                const p =
                    document.createElement(
                        "p"
                    );

                p.textContent =
                    child.textContent;

                text.appendChild(
                    p
                );

            }

        }
    );

    const end =
        document.createElement(
            "div"
        );

    end.className =
        "the-end";

    end.textContent =
        "THE END";

    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "ending-actions";

    const restart =
        document.createElement(
            "button"
        );

    restart.className =
        "end-btn";

    restart.textContent =
        "↻ เล่นเรื่องใหม่";

    restart.onclick =
        ()=>{
            clickSound();
            restartGame();
        };

    const top =
        document.createElement(
            "button"
        );

    top.className =
        "end-btn";

    top.textContent =
        "↑ กลับด้านบน";

    top.onclick =
        ()=>{
            window.scrollTo({
                top:0,
                behavior:"smooth"
            });
        };

    actions.appendChild(
        restart
    );

    actions.appendChild(
        top
    );

    ending.appendChild(icon);
    ending.appendChild(title);
    ending.appendChild(divider);
    ending.appendChild(text);
    ending.appendChild(end);
    ending.appendChild(actions);

    choices.appendChild(
        ending
    );

}

/* =========================================================
   START
========================================================= */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        ()=>{

            initAudio();

            clickSound();

            startScreen.classList.add(
                "hide"
            );

            setTimeout(
                ()=>{
                    showScene(
                        "prologue"
                    );
                },
                450
            );

        }
    );

/* =========================================================
   SOUND
========================================================= */

const soundBtn =
    document.getElementById(
        "soundBtn"
    );

soundBtn.addEventListener(
    "click",
    ()=>{

        audioEnabled =
            !audioEnabled;

        soundBtn.textContent =
            audioEnabled
                ? "🔊"
                : "🔇";

        if(audioEnabled){

            initAudio();

            clickSound();

        }

    }
);

/* =========================================================
   RESTART
========================================================= */

document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        ()=>{

            clickSound();

            restartGame();

        }
    );

function restartGame(){

    clearTimeout(
        typeTimer
    );

    localStorage.removeItem(
        "winterMemoryScene"
    );

    currentScene =
        "prologue";

    currentSceneData =
        STORY.prologue;

    isTyping =
        false;

    skipTyping =
        false;

    storyText.innerHTML =
        "";

    choices.innerHTML =
        "";

    continueBtn.classList.add(
        "hidden"
    );

    progressBar.style.width =
        "0%";

    progressText.textContent =
        "0%";

    startScreen.classList.remove(
        "hide"
    );

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* =========================================================
   CLICK TEXT = SKIP
========================================================= */

storyText.addEventListener(
    "click",
    ()=>{

        if(isTyping){

            skipTyping =
                true;

        }

    }
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    (event)=>{

        if(
            event.code === "Space"
        ){

            event.preventDefault();

            if(isTyping){

                skipTyping =
                    true;

            }else if(
                !continueBtn.classList.contains(
                    "hidden"
                )
            ){

                continueBtn.click();

            }

        }

    }
);

/* =========================================================
   LOAD
========================================================= */

window.addEventListener(
    "load",
    ()=>{

        /*
           ไม่โหลดฉากเก่าอัตโนมัติ
           เพื่อให้ผู้เล่นเริ่มจากหน้าแรกเสมอ
        */

        currentSceneData =
            STORY.prologue;

    }
);

</script>
