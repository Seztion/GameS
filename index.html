<head>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Prompt",sans-serif;
}

body{

    background:#07111f;

    color:#fff;

    overflow:hidden;

    height:100vh;

    position:relative;

}

.background{

    position:fixed;

    inset:0;

    background:

    linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.75)
    ),

    radial-gradient(
        circle at top,
        #1e3a8a,
        #07111f 70%
    );

    z-index:-5;

}

.aurora{

    position:fixed;

    inset:0;

    background:

    radial-gradient(
        circle at 20% 20%,
        rgba(0,255,255,.18),
        transparent 40%
    ),

    radial-gradient(
        circle at 80% 20%,
        rgba(0,255,120,.15),
        transparent 40%
    ),

    filter:blur(100px);

    animation:aurora 10s infinite alternate;

    z-index:-4;

}

@keyframes aurora{

    from{

        transform:scale(1);

    }

    to{

        transform:scale(1.2);

    }

}

.fog{

    position:fixed;

    inset:0;

    background:

    radial-gradient(
        circle,
        rgba(255,255,255,.08),
        transparent 60%
    );

    filter:blur(80px);

    animation:fog 20s infinite alternate;

    z-index:-3;

}

@keyframes fog{

    from{

        transform:translateX(-150px);

    }

    to{

        transform:translateX(150px);

    }

}

#snow{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-2;

}

.container{

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    padding:20px;

}

.panel{

    width:100%;

    max-width:950px;

    background:rgba(15,23,42,.75);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.1);

    border-radius:30px;

    padding:45px;

    box-shadow:0 30px 60px rgba(0,0,0,.5);

}

#startScreen{

    text-align:center;

}

.badge{

    display:inline-block;

    padding:10px 25px;

    border-radius:50px;

    background:rgba(255,255,255,.08);

    margin-bottom:25px;

}

.title{

    font-size:60px;

    margin-bottom:15px;

}

.subtitle{

    line-height:2;

    color:#d1d5db;

    margin-bottom:40px;

}

.menu{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

}

.btn{

    border:none;

    border-radius:50px;

    padding:15px 35px;

    cursor:pointer;

    color:white;

    transition:.3s;

}

.primary{

    background:#2563eb;

}

.secondary{

    background:rgba(255,255,255,.1);

}

.btn:hover{

    transform:translateY(-3px);

}

#gameScreen{

    display:none;

}

.header{

    display:flex;

    justify-content:space-between;

    margin-bottom:25px;

    padding-bottom:15px;

    border-bottom:1px solid rgba(255,255,255,.1);

}

.story{

    min-height:250px;

    line-height:2;

    color:#e5e7eb;

}

.choices{

    margin-top:25px;

    display:flex;

    flex-direction:column;

    gap:12px;

}

.choice{

    padding:18px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    background:rgba(255,255,255,.06);

    color:white;

    text-align:left;

    transition:.3s;

}

.choice:hover{

    background:rgba(37,99,235,.4);

    transform:translateX(8px);

}

.settings{

    display:none;

    margin-top:25px;

}

.setting-item{

    margin:15px 0;

}

@media(max-width:768px){

    .title{

        font-size:40px;

    }

    .panel{

        padding:25px;

    }

}

</style>

<script>
/* ==========================
   DOM
========================== */

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");

const storyBox = document.getElementById("story");
const choicesBox = document.getElementById("choices");

const progress = document.getElementById("progress");
const chapter = document.getElementById("chapter");

const settingsPanel =
document.getElementById("settingsPanel");

/* ==========================
   SETTINGS
========================== */

let textSpeed = 25;

const sliders =
document.querySelectorAll("input[type=range]");

if (sliders.length) {

    sliders[0].addEventListener("input", e => {

        textSpeed = Number(e.target.value);

    });

}

/* ==========================
   BUTTONS
========================== */

const buttons =
document.querySelectorAll(".menu .btn");

const newGameBtn = buttons[0];
const continueBtn = buttons[1];
const settingsBtn = buttons[2];

newGameBtn.onclick = () => {

    localStorage.removeItem("snow_save");

    openGame();

};

continueBtn.onclick = () => {

    const save =
    localStorage.getItem("snow_save");

    if (!save) {

        alert("ยังไม่มีข้อมูลที่บันทึกไว้");

        return;

    }

    openGame();

    loadScene(save);

};

settingsBtn.onclick = () => {

    settingsPanel.style.display =
    settingsPanel.style.display === "block"
        ? "none"
        : "block";

};

/* ==========================
   OPEN GAME
========================== */

function openGame() {

    startScreen.style.display = "none";

    gameScreen.style.display = "block";

    if (!localStorage.getItem("snow_save")) {

        loadScene("intro");

    }

}

/* ==========================
   TYPEWRITER
========================== */

function typeWriter(text, callback) {

    storyBox.innerHTML = "";

    let index = 0;

    const timer = setInterval(() => {

        storyBox.innerHTML += text[index];

        index++;

        if (index >= text.length) {

            clearInterval(timer);

            if (callback) {

                callback();

            }

        }

    }, textSpeed);

}

/* ==========================
   CREATE CHOICES
========================== */

function createChoices(scene) {

    choicesBox.innerHTML = "";

    scene.choices.forEach(choice => {

        const button =
        document.createElement("button");

        button.className = "choice";

        button.innerHTML = choice.text;

        button.onclick = () => {

            loadScene(choice.next);

        };

        choicesBox.appendChild(button);

    });

}

/* ==========================
   LOAD SCENE
========================== */

function loadScene(key) {

    const scene = STORY[key];

    localStorage.setItem(
        "snow_save",
        key
    );

    chapter.textContent =
    scene.chapter;

    progress.textContent =
    scene.progress;

    typeWriter(

        scene.text,

        () => {

            createChoices(scene);

        }

    );

}

/* ==========================
   SNOW EFFECT
========================== */

const canvas =
document.getElementById("snow");

const ctx =
canvas.getContext("2d");

function resize() {

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);

const flakes = [];

for (let i = 0; i < 180; i++) {

    flakes.push({

        x:
        Math.random() *
        canvas.width,

        y:
        Math.random() *
        canvas.height,

        r:
        Math.random() * 4 + 1,

        speed:
        Math.random() * 2 + 0.5

    });

}

function drawSnow() {

    ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

    );

    flakes.forEach(flake => {

        ctx.beginPath();

        ctx.arc(

            flake.x,
            flake.y,
            flake.r,
            0,
            Math.PI * 2

        );

        ctx.fillStyle =
        "rgba(255,255,255,.8)";

        ctx.fill();

        flake.y +=
        flake.speed;

        if (

            flake.y >
            canvas.height

        ) {

            flake.y = -10;

            flake.x =
            Math.random() *
            canvas.width;

        }

    });

    requestAnimationFrame(
        drawSnow
    );

}

drawSnow();

/* ==========================
   STARS
========================== */

for (let i = 0; i < 100; i++) {

    const star =
    document.createElement("div");

    star.style.position =
    "fixed";

    star.style.width =
    "2px";

    star.style.height =
    "2px";

    star.style.background =
    "white";

    star.style.borderRadius =
    "50%";

    star.style.left =
    Math.random() * 100 + "%";

    star.style.top =
    Math.random() * 100 + "%";

    star.style.opacity =
    Math.random();

    document.body.appendChild(
        star
    );

}

/* ==========================
   HISTORY
========================== */

const historyLog = [];

function addHistory(text) {

    historyLog.push(text);

}

</script>
<script>

/* =========================================================
   SNOW LETTER
   GAME ENGINE
========================================================= */

/* ---------------------------------------------------------
   ELEMENTS
--------------------------------------------------------- */

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");

const storyElement = document.getElementById("story");
const choicesElement = document.getElementById("choices");

const chapterElement = document.getElementById("chapter");
const progressElement = document.getElementById("progress");

const settingsPanel = document.getElementById("settingsPanel");

const snowCanvas = document.getElementById("snow");
const snowCtx = snowCanvas.getContext("2d");


/* ---------------------------------------------------------
   GAME STATE
--------------------------------------------------------- */

let currentScene = "intro";

let currentChapter = 1;

let affection = 0;

let trust = 0;

let memory = 0;

let courage = 0;

let truth = 0;

let typingSpeed = 25;

let typingTimer = null;

let isTyping = false;

let skipTyping = false;


/* ---------------------------------------------------------
   SAVE DATA
--------------------------------------------------------- */

const SAVE_KEY = "snow_letter_save";


function getGameData(){

    return {

        currentScene,

        currentChapter,

        affection,

        trust,

        memory,

        courage,

        truth

    };

}


function saveGame(){

    const data = getGameData();

    localStorage.setItem(

        SAVE_KEY,

        JSON.stringify(data)

    );

}


function loadSave(){

    const saved = localStorage.getItem(SAVE_KEY);

    if(!saved){

        return false;

    }

    try{

        const data = JSON.parse(saved);

        currentScene = data.currentScene || "intro";

        currentChapter = data.currentChapter || 1;

        affection = data.affection || 0;

        trust = data.trust || 0;

        memory = data.memory || 0;

        courage = data.courage || 0;

        truth = data.truth || 0;

        return true;

    }catch(error){

        console.error(

            "Save data error:",

            error

        );

        return false;

    }

}


function hasSave(){

    return localStorage.getItem(SAVE_KEY) !== null;

}


/* ---------------------------------------------------------
   NEW GAME
--------------------------------------------------------- */

function newGame(){

    currentScene = "intro";

    currentChapter = 1;

    affection = 0;

    trust = 0;

    memory = 0;

    courage = 0;

    truth = 0;

    saveGame();

    openGame();

}


/* ---------------------------------------------------------
   CONTINUE
--------------------------------------------------------- */

function continueGame(){

    if(!loadSave()){

        alert(

            "ยังไม่มีเกมที่บันทึกไว้"

        );

        return;

    }

    openGame();

}


/* ---------------------------------------------------------
   OPEN GAME
--------------------------------------------------------- */

function openGame(){

    startScreen.style.display = "none";

    gameScreen.style.display = "block";

    settingsPanel.style.display = "none";

    showScene(currentScene);

}


/* ---------------------------------------------------------
   RETURN TO TITLE
--------------------------------------------------------- */

function returnToTitle(){

    gameScreen.style.display = "none";

    startScreen.style.display = "block";

}


/* ---------------------------------------------------------
   TYPEWRITER
--------------------------------------------------------- */

function typeText(text, callback){

    clearInterval(typingTimer);

    storyElement.innerHTML = "";

    isTyping = true;

    skipTyping = false;

    let index = 0;

    typingTimer = setInterval(()=>{

        if(skipTyping){

            storyElement.innerHTML = text;

            clearInterval(typingTimer);

            typingTimer = null;

            isTyping = false;

            skipTyping = false;

            if(callback){

                callback();

            }

            return;

        }

        storyElement.innerHTML += text.charAt(index);

        index++;

        if(index >= text.length){

            clearInterval(typingTimer);

            typingTimer = null;

            isTyping = false;

            if(callback){

                callback();

            }

        }

    }, typingSpeed);

}


/* ---------------------------------------------------------
   CLICK STORY TO SKIP TYPING
--------------------------------------------------------- */

storyElement.addEventListener(

    "click",

    ()=>{

        if(isTyping){

            skipTyping = true;

        }

    }

);


/* ---------------------------------------------------------
   UPDATE STATUS
--------------------------------------------------------- */

function updateStatus(scene){

    if(scene.chapter){

        currentChapter = scene.chapter;

    }

    chapterElement.innerText =

        "Chapter " +

        currentChapter;

    const totalScore =

        affection +

        trust +

        memory +

        courage +

        truth;

    const percentage =

        Math.min(

            100,

            Math.max(

                0,

                Math.round(

                    totalScore / 5

                )

            )

        );

    progressElement.innerText =

        percentage +

        "%";

}


/* ---------------------------------------------------------
   SHOW CHOICES
--------------------------------------------------------- */

function showChoices(choices){

    choicesElement.innerHTML = "";

    if(!choices || choices.length === 0){

        return;

    }

    choices.forEach(

        (choice,index)=>{

            const button =

                document.createElement("button");

            button.className = "choice";

            button.innerHTML =

                "<span>" +

                (index + 1) +

                ". " +

                choice.text +

                "</span>";

            button.addEventListener(

                "click",

                ()=>{

                    makeChoice(choice);

                }

            );

            choicesElement.appendChild(

                button

            );

        }

    );

}


/* ---------------------------------------------------------
   MAKE CHOICE
--------------------------------------------------------- */

function makeChoice(choice){

    if(isTyping){

        skipTyping = true;

        return;

    }

    if(choice.effect){

        if(choice.effect.affection){

            affection +=

                choice.effect.affection;

        }

        if(choice.effect.trust){

            trust +=

                choice.effect.trust;

        }

        if(choice.effect.memory){

            memory +=

                choice.effect.memory;

        }

        if(choice.effect.courage){

            courage +=

                choice.effect.courage;

        }

        if(choice.effect.truth){

            truth +=

                choice.effect.truth;

        }

    }

    currentScene = choice.next;

    saveGame();

    showScene(currentScene);

}


/* ---------------------------------------------------------
   SHOW SCENE
--------------------------------------------------------- */

function showScene(sceneId){

    const scene = STORY[sceneId];

    if(!scene){

        console.error(

            "Scene not found:",

            sceneId

        );

        return;

    }

    updateStatus(scene);

    choicesElement.innerHTML = "";

    storyElement.classList.remove(

        "story-animation"

    );

    void storyElement.offsetWidth;

    storyElement.classList.add(

        "story-animation"

    );

    typeText(

        scene.text,

        ()=>{

            showChoices(

                scene.choices

            );

        }

    );

}


/* =========================================================
   SNOW SYSTEM
========================================================= */

let snowWidth =

    window.innerWidth;

let snowHeight =

    window.innerHeight;


function resizeSnow(){

    snowWidth =

        snowCanvas.width =

        window.innerWidth;

    snowHeight =

        snowCanvas.height =

        window.innerHeight;

}


window.addEventListener(

    "resize",

    resizeSnow

);


resizeSnow();


const snowflakes = [];


function createSnowflakes(){

    snowflakes.length = 0;

    const amount =

        window.innerWidth < 700

        ? 90

        : 180;

    for(

        let i = 0;

        i < amount;

        i++

    ){

        snowflakes.push({

            x:

                Math.random() *

                snowWidth,

            y:

                Math.random() *

                snowHeight,

            radius:

                Math.random() *

                3 +

                1,

            speed:

                Math.random() *

                1.8 +

                .5,

            wind:

                Math.random() *

                .8 -

                .4,

            opacity:

                Math.random() *

                .7 +

                .3,

            swing:

                Math.random() *

                Math.PI *

                2

        });

    }

}


createSnowflakes();


function drawSnow(){

    snowCtx.clearRect(

        0,

        0,

        snowWidth,

        snowHeight

    );

    snowflakes.forEach(

        flake=>{

            snowCtx.beginPath();

            snowCtx.fillStyle =

                "rgba(255,255,255," +

                flake.opacity +

                ")";

            snowCtx.arc(

                flake.x,

                flake.y,

                flake.radius,

                0,

                Math.PI * 2

            );

            snowCtx.fill();

            flake.y +=

                flake.speed;

            flake.swing +=

                .01;

            flake.x +=

                flake.wind +

                Math.sin(

                    flake.swing

                ) * .3;

            if(

                flake.y >

                snowHeight + 10

            ){

                flake.y = -10;

                flake.x =

                    Math.random() *

                    snowWidth;

            }

            if(

                flake.x >

                snowWidth + 10

            ){

                flake.x = -10;

            }

            if(

                flake.x < -10

            ){

                flake.x =

                    snowWidth + 10;

            }

        }

    );

    requestAnimationFrame(

        drawSnow

    );

}


drawSnow();


/* =========================================================
   STAR EFFECT
========================================================= */

function createStars(){

    const starLayer =

        document.createElement(

            "div"

        );

    starLayer.id =

        "starLayer";

    starLayer.style.position =

        "fixed";

    starLayer.style.inset =

        "0";

    starLayer.style.pointerEvents =

        "none";

    starLayer.style.zIndex =

        "-1";

    document.body.appendChild(

        starLayer

    );

    for(

        let i = 0;

        i < 70;

        i++

    ){

        const star =

            document.createElement(

                "span"

            );

        star.style.position =

            "absolute";

        star.style.left =

            Math.random() *

            100 +

            "%";

        star.style.top =

            Math.random() *

            65 +

            "%";

        const size =

            Math.random() *

            2.5 +

            1;

        star.style.width =

            size +

            "px";

        star.style.height =

            size +

            "px";

        star.style.borderRadius =

            "50%";

        star.style.background =

            "white";

        star.style.opacity =

            Math.random();

        star.style.boxShadow =

            "0 0 8px white";

        star.style.animation =

            "starTwinkle " +

            (

                Math.random() *

                4 +

                2

            ) +

            "s ease-in-out infinite";

        star.style.animationDelay =

            Math.random() *

            4 +

            "s";

        starLayer.appendChild(

            star

        );

    }

}


createStars();


/* =========================================================
   BUTTON CONNECTIONS
========================================================= */

const menuButtons =

    startScreen.querySelectorAll(

        ".btn"

    );


/*

Button 1 = New Game

Button 2 = Continue

Button 3 = Settings

*/

if(menuButtons[0]){

    menuButtons[0].addEventListener(

        "click",

        newGame

    );

}


if(menuButtons[1]){

    menuButtons[1].addEventListener(

        "click",

        continueGame

    );

}


if(menuButtons[2]){

    menuButtons[2].addEventListener(

        "click",

        openSettings

    );

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

    let existing =

        document.getElementById(

            "titleSettings"

        );

    if(existing){

        existing.remove();

    }

    const overlay =

        document.createElement(

            "div"

        );

    overlay.id =

        "titleSettings";

    overlay.style.position =

        "fixed";

    overlay.style.inset =

        "0";

    overlay.style.background =

        "rgba(2,6,23,.85)";

    overlay.style.backdropFilter =

        "blur(12px)";

    overlay.style.display =

        "flex";

    overlay.style.alignItems =

        "center";

    overlay.style.justifyContent =

        "center";

    overlay.style.zIndex =

        "100";

    overlay.innerHTML = `

        <div style="

            width:min(90%,430px);

            background:rgba(15,23,42,.96);

            border:1px solid rgba(255,255,255,.12);

            border-radius:25px;

            padding:30px;

            box-shadow:0 30px 70px rgba(0,0,0,.6);

        ">

            <h2 style="margin-bottom:25px;">

                ⚙ Settings

            </h2>

            <div style="margin-bottom:20px;">

                <label>

                    ❄ Snow Effect

                </label>

                <input

                    id="titleSnowToggle"

                    type="checkbox"

                    checked

                    style="margin-left:10px;"

                >

            </div>

            <div style="margin-bottom:20px;">

                <label>

                    ✨ Visual Effects

                </label>

                <input

                    id="titleEffectToggle"

                    type="checkbox"

                    checked

                    style="margin-left:10px;"

                >

            </div>

            <div style="margin-bottom:20px;">

                <label>

                    ⌨ Text Speed

                </label>

                <input

                    id="titleSpeed"

                    type="range"

                    min="10"

                    max="80"

                    value="${typingSpeed}"

                    style="width:100%;margin-top:10px;"

                >

            </div>

            <button

                id="closeTitleSettings"

                class="btn primary"

                style="width:100%;"

            >

                ✓ Done

            </button>

        </div>

    `;

    document.body.appendChild(

        overlay

    );

    document

        .getElementById(

            "titleSpeed"

        )

        .addEventListener(

            "input",

            e=>{

                typingSpeed =

                    Number(

                        e.target.value

                    );

            }

        );

/* =========================================================
   CURRENT ENDING
========================================================= */

let currentEnding = null;


/* =========================================================
   SAVE ENDING
========================================================= */

function saveEnding(endingId) {

    if (!ENDINGS[endingId]) {
        console.warn("ไม่พบ Ending:", endingId);
        return;
    }

    currentEnding = endingId;

    let unlocked = [];

    try {

        unlocked =
            JSON.parse(
                localStorage.getItem("winter_story_endings")
            ) || [];

    } catch (error) {

        unlocked = [];

    }


    if (!unlocked.includes(endingId)) {

        unlocked.push(endingId);

    }


    localStorage.setItem(
        "winter_story_endings",
        JSON.stringify(unlocked)
    );

}


/* =========================================================
   GET UNLOCKED ENDINGS
========================================================= */

function getUnlockedEndings() {

    try {

        return JSON.parse(
            localStorage.getItem("winter_story_endings")
        ) || [];

    } catch (error) {

        return [];

    }

}


/* =========================================================
   COUNT ENDINGS
========================================================= */

function getEndingProgress() {

    const unlocked = getUnlockedEndings();

    const total = Object.keys(ENDINGS).length;

    return {

        unlocked: unlocked.length,

        total: total,

        percent:
            Math.round(
                (unlocked.length / total) * 100
            )

    };

}


/* =========================================================
   SHOW ENDING SCREEN
========================================================= */

function showEndingScreen(endingId) {

    const ending = ENDINGS[endingId];

        console.error(

            endingId

    screen.classList.remove(
        "show"

    setTimeout(() => {

/* =========================================================
   RESTART GAME
========================================================= */

function restartGame() {

    currentEnding = null;


    const screen =
        document.querySelector(
            "#endingScreen"
        );


    if (screen) {

        screen.remove();

    }


    /* -----------------------------------------------------
       RESET GAME VARIABLES
    ----------------------------------------------------- */

    if (typeof currentStory !== "undefined") {

        currentStory = "start";

    }


    if (typeof currentScene !== "undefined") {

        currentScene = "start";

    }


    if (typeof currentChapter !== "undefined") {

        currentChapter = 1;

    }


    if (typeof playerChoices !== "undefined") {

        playerChoices = [];

    }


    /* -----------------------------------------------------
       TRY EXISTING GAME FUNCTION
    ----------------------------------------------------- */

    if (
        typeof startGame === "function"
    ) {

        startGame();

        return;

    }


    if (
        typeof startStory === "function"
    ) {

        startStory();

        return;

    }


    if (
        typeof loadStory === "function"
    ) {

        loadStory("start");

        return;

    }


    /* -----------------------------------------------------
       FALLBACK
    ----------------------------------------------------- */

    location.reload();

}


/* =========================================================

========================================================= */

function backToTitle() {

    const screen =
        document.querySelector(
            "#endingScreen"
        );


    if (screen) {

        screen.remove();

    }


    if (
        typeof showTitleScreen ===
        "function"
    ) {

        showTitleScreen();

        return;

    }


    if (
        typeof showMainMenu ===
        "function"
    ) {

        showMainMenu();

        return;

    }


    location.reload();

}


/* =========================================================
   CONNECT STORY ENDINGS
========================================================= */

function handleEndingNode(nodeId) {

    if (
        ENDINGS[nodeId]
    ) {

        showEndingScreen(
            nodeId
        );

        return true;

    }


    return false;

}


/* =========================================================
   PATCH STORY ENGINE
   ตรวจสอบ Ending ก่อนแสดง Scene ปกติ
========================================================= */

function processStoryNode(nodeId) {

    if (
        handleEndingNode(nodeId)
    ) {

        return;

    }


    if (
        typeof STORY === "undefined"
    ) {

        console.error(
            "ไม่พบ STORY"
        );

        return;

    }


    const node =
        STORY[nodeId];


    if (!node) {

        console.error(
            "ไม่พบ Story Node:",
            nodeId
        );

        return;

    }


    /* -----------------------------------------------------
       UPDATE CHAPTER
    ----------------------------------------------------- */

    if (
        typeof node.chapter !==
        "undefined"
    ) {

        if (
            typeof currentChapter !==
            "undefined"
        ) {

            currentChapter =
                node.chapter;

        }

    }


    /* -----------------------------------------------------
       FIND TEXT ELEMENT
    ----------------------------------------------------- */

    const textElement =
        document.querySelector(
            "#storyText"
        ) ||
        document.querySelector(
            ".story-text"
        ) ||
        document.querySelector(
            "#text"
        );


    if (textElement) {

        textElement.innerHTML =
            node.text
                .trim()
                .replace(
                    /\n/g,
                    "<br>"
                );

    }


    /* -----------------------------------------------------
       FIND CHOICE ELEMENT
    ----------------------------------------------------- */

    const choiceElement =
        document.querySelector(
            "#choices"
        ) ||
        document.querySelector(
            ".choices"
        );


    if (!choiceElement) {

        return;

    }


    choiceElement.innerHTML = "";


    if (
        !node.choices ||
        node.choices.length === 0
    ) {

        return;

    }


    node.choices.forEach(
        (choice) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "choice-button";


            button.innerHTML =
                choice.text;


            button.onclick = () => {

                processStoryNode(
                    choice.next
                );

            };


            choiceElement.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   AUTO DETECT ORIGINAL STORY FUNCTION
========================================================= */

function continueStory(nextNode) {

    processStoryNode(
        nextNode
    );

}
